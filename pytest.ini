[pytest]
python_files = test_*.py
testpaths = tests
markers =
    core: P0 高价值核心回归集（CI 必跑）
    full: 全量回归集（全部脚本，test_server 默认 skip）
    server: 远程部署冒烟（非本地回归，默认 skip）
addopts = -p no:cacheprovider
filterwarnings =
    # 依赖行为，暂不升级依赖（T20260820-001-TD）：
    # starlette 1.6.0 + fastapi 0.139.0 + httpx 0.28.1 组合下，starlette.testclient
    # 对 httpx 发出弃用警告（提示安装 httpx2），属上游依赖行为；锁定版本运行，
    # 不升级依赖，精确抑制该类警告（仅抑制 starlette.exceptions.StarletteDeprecationWarning）。
    ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
