<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 知·社区网格</title>
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.min.css">
    <style>
        /* ==========================================================================
           管理后台专属样式 · 复用 common.css 设计 token
           ========================================================================== */
        .container { max-width: 1200px; }

        /* ---- 统计卡片 ---- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stat-icon .icon { width: 20px; height: 20px; }
        .stat-icon.blue   { background: var(--accent-soft);  color: var(--accent); }
        .stat-icon.green  { background: var(--success-soft); color: var(--success); }
        .stat-icon.orange { background: var(--warning-soft); color: var(--warning); }
        .stat-icon.purple { background: var(--muted-soft);   color: var(--text-2); }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-1);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }
        .stat-label { font-size: 13px; color: var(--text-3); margin-top: 2px; }

        /* ---- 图表 ---- */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .bar-chart { display: flex; flex-direction: column; gap: 12px; }
        .bar-item { display: flex; align-items: center; gap: 10px; }
        .bar-label {
            width: 80px;
            font-size: 13px;
            color: var(--text-2);
            text-align: right;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: var(--surface-2);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: var(--radius-pill);
            transition: width 0.6s ease;
            min-width: 4px;
        }
        .bar-fill.blue   { background: var(--accent); }
        .bar-fill.red    { background: var(--danger); }
        .bar-fill.orange { background: var(--warning); }
        .bar-fill.green  { background: var(--success); }
        .bar-fill.purple { background: var(--accent); }
        .bar-fill.cyan   { background: var(--accent); }
        .bar-value {
            min-width: 28px;
            font-size: 13px;
            color: var(--text-2);
            font-weight: 600;
            flex-shrink: 0;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ---- 人工审核 ---- */
        .review-tabs {
            display: flex;
            gap: 4px;
            width: fit-content;
            padding: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            margin-bottom: 18px;
        }
        .review-tab {
            padding: 7px 18px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            background: transparent;
            color: var(--text-2);
            transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }
        .review-tab.active {
            background: var(--surface);
            color: var(--accent);
            font-weight: 600;
            box-shadow: var(--shadow);
        }
        .review-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--warning);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .review-card.accepted { border-left-color: var(--accent); }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .review-user {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--text-2);
        }
        .review-user strong { color: var(--text-1); }
        .user-meta {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-2);
        }
        .user-meta .icon { color: var(--text-3); }
        .review-desc {
            font-size: 15px;
            color: var(--text-1);
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .review-beneficiary {
            font-size: 12px;
            color: var(--text-3);
            background: var(--surface-2);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            margin: -4px 0 12px;
            line-height: 1.5;
        }
        .review-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-desc {
            font-size: 13px;
            color: var(--text-3);
            margin: -8px 0 14px 0;
        }

        /* ---- 定位展示 ---- */
        .loc-badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            margin-right: 6px;
        }
        .loc-ok { background: rgba(46, 160, 67, 0.15); color: #2ea043; }
        .loc-warn { background: rgba(219, 143, 2, 0.15); color: #db8f02; }
        .loc-coords { font-family: Consolas, monospace; font-size: 12px; color: var(--text-2); }
        .loc-dist { font-size: 12px; color: var(--text-3); margin-left: 8px; }
        .comm-actions { display: flex; align-items: center; gap: 18px; margin: 2px 0 4px; font-size: 14px; }
        .comm-actions .btn { margin-top: 0; }  /* 抵消 .btn 默认 margin-top:14px */
        .comm-map {
            position: relative;
            z-index: 0;
            height: 300px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-top: 12px;
            overflow: hidden;
        }
        .comm-pin { background: none; border: none; }  /* 自定义 divIcon，去掉 leaflet 默认白框 */
        .comm-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
        .locate-hint.error {
            color: var(--danger);
            font-weight: 600;
        }
        .loc-link {
            margin-left: 8px;
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
        }
        .loc-link:hover { text-decoration: underline; }
        .loc-cell { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }

        /* ---- 小型按钮 ---- */
        .btn-sm {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.12s ease;
        }
        .btn-sm:hover { background: var(--accent-hover); }
        .btn-sm:active { transform: scale(0.98); }
        .btn-sm.btn-accept { background: var(--accent); }
        .btn-sm.btn-done   { background: var(--success); }
        .btn-sm.btn-done:hover { filter: brightness(0.92); }
        .btn-sm.btn-refresh {
            background: var(--surface);
            color: var(--text-2);
            border: 1px solid var(--border-strong);
        }
        .btn-sm.btn-refresh:hover { background: var(--surface-2); color: var(--text-1); }
    .btn-sm.btn-reject { background: var(--danger); }
    .btn-sm.btn-reject:hover { filter: brightness(0.92); }

        /* ---- 回复输入区 ---- */
        .reply-box { margin-top: 12px; display: none; }
        .reply-box.visible { display: block; }
        .reply-box textarea { min-height: 60px; }
        .reply-box .btn-sm { margin-top: 8px; }

        /* ---- 同一用户多事件折叠 ---- */
        .review-collapsed { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
        .review-collapsed.visible { display: block; }
        .review-expand-btn { background: var(--surface-2); border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; margin-top: 10px; }
        .review-expand-btn:hover { background: var(--border-strong); }
        .collapsed-card { background: var(--surface-2); border-radius: 8px; padding: 12px; margin-top: 8px; border-left: 3px solid #d97706; }

        /* ---- 回复历史 ---- */
        .reply-history { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
        .reply-history-item { padding: 6px 0; }
        .reply-history-meta { font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
        .reply-history-content { font-size: 14px; color: var(--text-1); word-break: break-all; }

        /* ---- 筛选栏 ---- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 12px;
            margin-bottom: 18px;
        }
        .filter-bar label { font-size: 13px; color: var(--text-2); }
        .filter-bar select { width: auto; min-width: 118px; padding: 8px 10px; }
        .filter-bar .btn-refresh { margin-left: auto; }

        /* ---- 事件表格（可排序） ---- */
        #tableContainer table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        #tableContainer thead th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text-3);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        #tableContainer thead th:hover { color: var(--text-1); }
        #tableContainer tbody td {
            padding: 12px;
            border-top: 1px solid var(--border);
            color: var(--text-1);
            vertical-align: top;
        }
        #tableContainer tbody tr:hover { background: var(--surface-2); }
        .sort-indicator {
            display: inline-flex;
            margin-left: 5px;
            color: var(--text-3);
            vertical-align: -1px;
        }
        .sort-indicator .icon { width: 12px; height: 12px; }

        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-3);
        }

        /* ---- 移动端：表格转卡片 ---- */
        @media (max-width: 768px) {
            .filter-bar select,
            .filter-bar .btn-sm { min-height: 40px; }
            .filter-bar .btn-refresh { margin-left: 0; }
            #tableContainer table thead { display: none; }
            #tableContainer table,
            #tableContainer table tbody,
            #tableContainer table tr,
            #tableContainer table td { display: block; width: 100%; }
            #tableContainer table tr {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 12px 14px;
                margin-bottom: 12px;
                box-shadow: var(--shadow);
            }
            #tableContainer table tr:hover { background: var(--surface); }
            #tableContainer table td {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: flex-start;
                gap: 2px 12px;
                padding: 6px 0;
                border-top: none;
                font-size: 14px;
                overflow-wrap: anywhere;
            }
            #tableContainer table td::before {
                content: attr(data-label);
                color: var(--text-3);
                flex-shrink: 0;
                font-weight: 500;
            }
            #tableContainer table td:first-child { padding-top: 0; }
            #tableContainer table td:last-child { padding-bottom: 0; }
            .table-footer { flex-direction: column; align-items: flex-start; gap: 4px; }

            /* 分段标签 → 满宽等分，触控更大 */
            .review-tabs { width: 100%; }
            .review-tab { flex: 1; text-align: center; padding: 9px 4px; white-space: nowrap; }

            /* 筛选栏：隐藏文字标签，选中控件两列排布，按钮满宽 */
            .filter-bar label { display: none; }
            .filter-bar select { flex: 1 1 calc(50% - 6px); min-width: 0; }
            .filter-bar .btn-sm { flex: 1; justify-content: center; }

            /* 审核操作区：按钮等宽满行 */
            .review-actions { width: 100%; }
            .review-actions .btn-sm { flex: 1; justify-content: center; }
            .review-expand-btn { width: 100%; }

            /* 统一触控高度 */
            .btn-sm { min-height: 40px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-title" id="comm-title">
            知·社区网格
            <span class="topbar-sub">管理后台</span>
        </div>
        <div class="userbar">
            <div class="user-info">
                <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="4.6" r="2.4"/><path d="M2.8 13.5c.6-2.5 2.9-3.8 5.2-3.8s4.6 1.3 5.2 3.8"/></svg>
                <strong id="user-name">-</strong>
                <span class="role-tag admin" id="user-role">街道管理员</span>
            </div>
            <div class="user-actions">
                <a onclick="logout()">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3H3.8A1.3 1.3 0 0 0 2.5 4.3v7.4A1.3 1.3 0 0 0 3.8 13h2.7"/><path d="M13.5 8H7M11 5.5l3 2.5-3 2.5"/></svg>
                    <span>退出登录</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 统计卡片 -->
        <div class="stat-grid" id="statGrid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="7" height="10.5" rx="1.5"/><path d="M6.5 6h3M6.5 8.5h3M6.5 11h1.5"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-total">-</div>
                    <div class="stat-label">事件总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 11.5 6 8l2.3 2.3L13.5 5M10.3 5h3.2v3.2"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-today">-</div>
                    <div class="stat-label">今日新增</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.4"/><path d="M8 4.8V8l2.4 1.5"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-pending">-</div>
                    <div class="stat-label">待处理数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 8.4 6 11.5 13.2 4.3"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-done">-</div>
                    <div class="stat-label">已处理数</div>
                </div>
            </div>
        </div>

        <!-- 工单处理专区 -->
        <div class="card review-section">
            <div class="section-actions">
                <h2>工单处理</h2>
                <span class="unread-dot hidden" id="unreadBadge">0</span>
            </div>
            <div class="review-tabs">
                <button class="review-tab active" id="tab-todo" onclick="switchReviewTab('todo')">待我处理</button>
                <button class="review-tab" id="tab-mine" onclick="switchReviewTab('mine')">我处理的</button>
                <button class="review-tab" id="tab-all" onclick="switchReviewTab('all')">全部</button>
            </div>
            <div id="reviewContainer"><div class="empty">加载中…</div></div>
        </div>

        <!-- 部门账号管理（仅超管） -->
        <div class="card review-section hidden" id="deptUsersCard">
            <h2>部门账号管理</h2>
            <div class="form-row">
                <div class="form-group"><label>用户名</label><input type="text" id="du-username"></div>
                <div class="form-group"><label>姓名</label><input type="text" id="du-real_name"></div>
                <div class="form-group"><label>手机号</label><input type="tel" id="du-phone"></div>
                <div class="form-group"><label>密码</label><input type="text" id="du-password" placeholder="至少6位"></div>
                <div class="form-group"><label>部门</label><select id="du-department"></select></div>
            </div>
            <button class="btn-sm" onclick="createDeptUser()">新建部门账号</button>
            <div id="deptUsersList" style="margin-top:10px;"></div>
        </div>

        <!-- 社区设置专区 -->
        <div class="card review-section">
            <h2>社区设置</h2>
            <p class="section-desc">设置小区中心位置：点「一键定位」跳到当前位置，再拖动/点击地图标记选社区中心，用于事件/住户距中心距离计算。</p>
            <div class="form-row">
                <div class="form-group">
                    <label for="comm-name">社区名称</label>
                    <input type="text" id="comm-name" placeholder="请输入社区名称">
                </div>
                <div class="form-group">
                    <label for="comm-radius">覆盖半径（米）</label>
                    <input type="number" id="comm-radius" placeholder="如：500" min="1" step="1">
                </div>
            </div>
            <div class="comm-actions">
                <button class="btn btn-ghost" id="comm-locate-btn" onclick="locateCommunity()">一键定位</button>
                <a class="loc-link" id="comm-map-btn" href="#" target="_blank" rel="noopener">打开高德地图查看位置</a>
            </div>
            <div id="comm-map" class="comm-map"></div>
            <div class="locate-hint" id="comm-coords">中心坐标：未选择</div>
            <div class="comm-footer">
                <span id="comm-updated" class="locate-status"></span>
                <button class="btn" id="comm-save-btn" onclick="saveCommunitySettings()">保存设置</button>
            </div>
            <div class="locate-hint" id="comm-msg"></div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-row">
            <div class="card chart-container">
                <h2>事件类型分布</h2>
                <div class="bar-chart" id="typeChart">
                    <div class="empty">加载中…</div>
                </div>
            </div>
            <div class="card chart-container">
                <h2>紧急程度分布</h2>
                <div class="bar-chart" id="urgencyChart">
                    <div class="empty">加载中…</div>
                </div>
            </div>
            <div class="card chart-container">
                <h2>场景标签分布</h2>
                <div class="bar-chart" id="sceneChart">
                    <div class="empty">加载中…</div>
                </div>
            </div>
        </div>

        <!-- 事件列表 -->
        <div class="card">
            <h2>事件列表</h2>
            <div class="filter-bar">
                <label>状态：</label>
                <select id="filterStatus">
                    <option value="">全部</option>
                    <option value="待审核">待审核</option>
                    <option value="待处理">待处理</option>
                    <option value="已受理">已受理</option>
                    <option value="处理中">处理中</option>
                    <option value="已完成">已完成</option>
                    <option value="已派单">已派单</option>
                    <option value="处理超时">处理超时</option>
                    <option value="处理失败">处理失败</option>
                    <option value="已拒绝">拒绝</option>
                </select>
                <label>类型：</label>
                <select id="filterType">
                    <option value="">全部</option>
                </select>
                <label>紧急程度：</label>
                <select id="filterUrgency">
                    <option value="">全部</option>
                    <option value="高">高</option>
                    <option value="中">中</option>
                    <option value="低">低</option>
                </select>
                <label>场景标签：</label>
                <select id="filterScene">
                    <option value="">全部</option>
                    <option value="生命急救">生命急救</option>
                    <option value="紧急救援">紧急救援</option>
                    <option value="常规">常规</option>
                </select>
                <button class="btn-sm" onclick="applyFilters()">筛选</button>
                <button class="btn-sm btn-refresh" onclick="loadData()">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 6.2A4.8 4.8 0 1 0 13 8"/><path d="M13.2 2.8V6h-3.2"/></svg>
                    刷新
                </button>
            </div>
            <div id="tableContainer">
                <div class="empty">加载中…</div>
            </div>
            <div class="table-footer">
                <span id="showingInfo">共 0 条记录</span>
                <span>数据实时来源于 GET /api/events</span>
            </div>
        </div>
    </div>

    <script src="/vendor/leaflet/leaflet.min.js"></script>
    <script>
        const API_BASE = '';

        // 社区名称动态化：标题/页头随后台设置更新
        (function () {
            fetch(API_BASE + '/api/community')
                .then(r => (r.ok ? r.json() : null))

        // ------------------------------------------------------------------
        // 认证相关
        // ------------------------------------------------------------------
        function getAuthHeaders(contentType = true) {
            const headers = {};
            if (contentType) headers['Content-Type'] = 'application/json';
            const token = localStorage.getItem('token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        function checkUnauthorized(res) {
            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
                return true;
            }
            return false;
        }

        async function initAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            try {
                const res = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return false;
                if (!res.ok) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '/login.html';
                    return false;
                }
                const user = await res.json();
                if (user.role !== 'admin' && user.role !== 'dept') {
                    alert('权限不足，仅工作人员可访问后台管理页面');
                    window.location.href = '/';
                    return false;
                }
                window.currentUser = user;
                document.getElementById('user-name').textContent = user.real_name || user.username;
                const roleEl = document.getElementById('user-role');
                if (user.role === 'dept') {
                    roleEl.textContent = user.department_name || '部门账号';
                    roleEl.className = 'role-tag dept';
                    document.getElementById('tab-all').style.display = 'none';
                } else {
                    roleEl.textContent = '超级管理员';
                    roleEl.className = 'role-tag super';
                    document.getElementById('tab-all').style.display = '';
                    document.getElementById('deptUsersCard').classList.remove('hidden');
                }
                return true;
            } catch (e) {
                alert('网络异常，请重新登录');
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
                return false;
            }
        }

        async function logout() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    await fetch(`${API_BASE}/api/auth/logout`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (e) {
                    // 网络异常不影响本地登出
                }
            }
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        function countBy(arr, key) {
            const map = {};

                map[val] = (map[val] || 0) + 1;
            }
            return map;

        // 工具：获取今日日期字符串 YYYY-MM-DD
        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // 渲染统计卡片
        function renderStats(events) {
            const total = events.length;
            const today = todayStr();
            const todayCount = events.filter(e => (e.created_at || '').startsWith(today)).length;
            const pending = events.filter(e => e.status === '处理中' || e.status === '待审核' || e.status === '待处理' || e.status === '已受理').length;
            const done = events.filter(e => e.status === '已完成' || e.status === '已派单').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-today').textContent = todayCount;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-done').textContent = done;

        // 渲染条形图
        function renderBarChart(containerId, dataMap, colorClassMap) {
            const container = document.getElementById(containerId);
            const entries = Object.entries(dataMap).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty">暂无数据</div>';
                return;
            }
            const maxVal = Math.max(...entries.map(e => e[1]));
            const colors = ['blue', 'green', 'orange', 'purple', 'red', 'cyan'];
            const html = entries.map((entry, idx) => {
                const label = entry[0];
                const val = entry[1];
                const pct = maxVal > 0 ? (val / maxVal * 100) : 0;
                const color = colorClassMap && colorClassMap[label] ? colorClassMap[label] : colors[idx % colors.length];
                return `
                    <div class="bar-item">
                        <div class="bar-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
                        <div class="bar-track">
                            <div class="bar-fill ${color}" style="width: ${pct}%"></div>
                        </div>
                        <div class="bar-value">${val}</div>
                    </div>
                `;
            }).join('');
            container.innerHTML = html;
        }

        function renderCard(e) {
            const role = (window.currentUser || {}).role;
            const dept = (window.currentUser || {}).department || '';
            const owned = e.assigned_dept === dept || e.reviewer_dept === dept || role === 'admin';
            const canAct = role === 'admin' || owned;
            const canHandle = canAct && ['已受理', '处理中', '已完成'].includes(e.status);
            const actions = [];
            if (canAct && e.status === '待处理') {
                actions.push(`<button class="btn-sm btn-accept" onclick="acceptEvent('${e.event_id}')">受理</button>`);
                actions.push(`<button class="btn-sm btn-reject" onclick="rejectEvent('${e.event_id}')">拒绝</button>`);
            }
            if (canAct && e.status === '待审核') {
                actions.push(`<button class="btn-sm btn-reject" onclick="rejectEvent('${e.event_id}')">拒绝</button>`);
            }
            if (canAct && e.status === '已受理') {
                actions.push(`<button class="btn-sm" onclick="startEvent('${e.event_id}')">开始处理</button>`);
            }
            if (canAct && ['已受理', '处理中'].includes(e.status)) {
                actions.push(`<button class="btn-sm btn-done" onclick="completeEvent('${e.event_id}')">完成</button>`);
            }

            const typeSel = `<select class="review-card-select" onchange="changeType('${e.event_id}', this.value)">` + EVENT_TYPES.map(t => `<option value="${t}" ${e.event_type === t ? 'selected' : ''}>${t}</option>`).join('') + `</select>`;
            let deptSel = '';

                deptSel = `<select class="review-card-select" onchange="changeDept('${e.event_id}', this.value)"><option value="">改派…</option>` + Object.entries(DEPTS).map(([k, v]) => `<option value="${k}" ${e.assigned_dept === k ? 'selected' : ''}>${v}</option>`).join('') + `</select>`;

            const interaction = canHandle
                ? `<div class="reply-box visible">

                      <div class="photo-grid" id="card-photos-${e.event_id}"></div>
                      <div class="form-row">

                <div class="review-meta-line">类型：${typeSel} ${deptSel} · 部门：${escapeHtml(e.department_name || e.handler || '-')}${e.status === '待审核' ? '（待审核：请先修改类型归类后受理）' : ''}</div>

        // ------------------------------------------------------------------
        // 社区设置专区：一键定位 + 内嵌可拖动地图
        // ------------------------------------------------------------------
        let commMap = null;
        let commMarker = null;
        let commCenter = { lat: null, lng: null };

        // 浏览器定位封装：成功返回 {lat,lng}，失败/拒绝返回 null
        function getPosition() {
            return new Promise(resolve => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                let done = false;
                const finish = v => { if (!done) { done = true; resolve(v); } };
                try {
                    navigator.geolocation.getCurrentPosition(
                        pos => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                        () => finish(null),
                        { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
                    );
                } catch (e) {
                    // 非安全上下文/部分浏览器会同步抛异常：兜底为不可用，避免按钮卡在"定位中…"无反应
                    finish(null);
                }
            });
        }

        async function loadCommunitySettings() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/community`, {
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) {
                    document.getElementById('comm-msg').textContent = '加载社区设置失败';
                    return;
                }
                const cfg = await res.json();
                document.getElementById('comm-name').value = cfg.name || '';
                document.getElementById('comm-radius').value = cfg.radius_m;
                document.getElementById('comm-updated').textContent = cfg.updated_at ? `最后更新：${cfg.updated_at}` : '';
                initCommMap(cfg.center_lat, cfg.center_lng, cfg.name || '');

                document.getElementById('comm-msg').textContent = '加载社区设置失败';
            }
        }

        function commPinIcon() {
            return L.divIcon({
                className: 'comm-pin',
                html: '<svg viewBox="0 0 24 24" width="30" height="30" fill="#e02424"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg>',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
        }

        function initCommMap(lat, lng, name) {
            // 坐标始终先由已保存配置兜底（Leaflet 加载失败也能按原中心保存）
            if (lat != null && lng != null) {
                commCenter = { lat, lng };
                setCommCenter(lat, lng, name);
            }
            const el = document.getElementById('comm-map');
            if (typeof L === 'undefined') {
                el.innerHTML = '<div class="empty">地图组件未加载，请刷新或检查网络；仍可按当前中心保存</div>';
                return;
            }
            if (!commMap) {
                commMap = L.map('comm-map').setView([lat || 30.274, lng || 120.155], 16);
                L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                    subdomains: ['1', '2', '3', '4'],
                    maxZoom: 18,
                    attribution: '© 高德地图'
                }).addTo(commMap);
                commMarker = L.marker([lat || 30.274, lng || 120.155], { draggable: true, icon: commPinIcon() }).addTo(commMap);
                commMarker.on('dragend', () => {
                    const p = commMarker.getLatLng();
                    setCommCenter(p.lat, p.lng);
                });
                commMap.on('click', e => {
                    commMarker.setLatLng(e.latlng);
                    setCommCenter(e.latlng.lat, e.latlng.lng);
                });
            }
            if (lat != null && lng != null) {
                commMarker.setLatLng([lat, lng]);
                commMap.setView([lat, lng], 16);
            }
        }

        function setCommCenter(lat, lng, name) {
            commCenter = { lat, lng };
            document.getElementById('comm-coords').textContent = `中心坐标：${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            updateCommMapBtn(lat, lng, name || document.getElementById('comm-name').value.trim());
        }

        async function locateCommunity() {
            const btn = document.getElementById('comm-locate-btn');
            const msg = document.getElementById('comm-msg');
            msg.className = 'locate-hint';
            if (!commMap) { msg.className = 'locate-hint error'; msg.textContent = '地图未就绪，请刷新页面后再试'; return; }
            if (window.isSecureContext === false) {
                msg.className = 'locate-hint error';
                msg.textContent = '当前为 http 访问，浏览器已禁用定位（需 HTTPS 或 localhost）。请直接拖动/点击地图标记选择社区中心后保存';
                return;
            }
            btn.disabled = true;
            btn.textContent = '定位中…';
            const pos = await getPosition();
            btn.disabled = false;
            btn.textContent = '一键定位';
            if (pos) {
                commMap.flyTo([pos.lat, pos.lng], 16);
                commMarker.setLatLng([pos.lat, pos.lng]);
                setCommCenter(pos.lat, pos.lng);
                msg.className = 'locate-hint';
                msg.textContent = '已定位到当前位置，拖动标记或点击地图调整社区中心';
            } else {
                msg.className = 'locate-hint error';
                msg.textContent = '未能获取定位（浏览器拒绝位置权限或定位不可用）。请允许位置权限后重试，或直接拖动/点击地图标记选择社区中心';
            }
        }

        function updateCommMapBtn(lat, lng, name) {
            if (lat == null || lng == null) return;
            const url = `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name || '社区中心')}&src=community-grid`;
            document.getElementById('comm-map-btn').href = url;
        }

        async function saveCommunitySettings() {
            const name = document.getElementById('comm-name').value.trim();
            const radius = parseFloat(document.getElementById('comm-radius').value);
            const msg = document.getElementById('comm-msg');
            msg.textContent = '';

            if (commCenter.lat == null || commCenter.lng == null) { msg.textContent = '请先在地图上选择社区中心'; return; }
            if (!(radius > 0)) { msg.textContent = '覆盖半径需大于 0'; return; }

            const btn = document.getElementById('comm-save-btn');
            btn.disabled = true;
            btn.textContent = '保存中…';
            try {
                const res = await fetch(`${API_BASE}/api/admin/community`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ name, center_lat: commCenter.lat, center_lng: commCenter.lng, radius_m: radius })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) {
                    let detail = '保存失败';
                    try { detail = (await res.json()).detail || detail; } catch (e) {}
                    msg.textContent = detail;
                    return;
                }
                const cfg = await res.json();
                document.getElementById('comm-updated').textContent = cfg.updated_at ? `最后更新：${cfg.updated_at}` : '';
                updateCommMapBtn(cfg.center_lat, cfg.center_lng, cfg.name);
                msg.textContent = '已保存，事件/住户距离将按新中心计算';
            } catch (e) {
                msg.textContent = '网络请求失败，请检查服务是否启动';
            } finally {
                btn.disabled = false;
                btn.textContent = '保存设置';
            }
        }

        async function acceptEvent(eventId) {
            const el = document.getElementById(`reply-text-${eventId}`);
            const reply = el ? el.value.trim() : '';
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/accept`, {
                    method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ reply })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { const err = await res.json().catch(() => ({})); alert((err.error || err.detail) || '受理失败'); return; }
                await loadData();
            } catch (e) { alert('网络请求失败'); }
        }

        async function rejectEvent(eventId) {
            const el = document.getElementById(`reply-text-${eventId}`);
            const reason = el ? el.value.trim() : '';
            if (!reason) { alert('请先填写拒绝理由'); return; }
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/reject`, {
                    method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ reason })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { const err = await res.json().catch(() => ({})); alert((err.error || err.detail) || '拒绝失败'); return; }
                await loadData();
            } catch (e) { alert('网络请求失败'); }
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        async function submitReply(eventId) {
            const el = document.getElementById(`reply-text-${eventId}`);
            const reply = el ? el.value.trim() : '';
            if (!reply) { alert('请输入回复内容'); return; }
            const photos = window.cardPhotos[eventId] || [];
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/reply`, {
                    method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ reply, photos })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { const err = await res.json().catch(() => ({})); alert((err.error || err.detail) || '回复失败'); return; }
                resetCardPhotos(eventId);
                await loadData();
            } catch (e) { alert('网络请求失败'); }
        }

        async function uploadAdminFiles(files) {
            const ids = [];
            for (const f of Array.from(files || [])) {
                if (!f) continue;
                const fd = new FormData(); fd.append('file', f);
                const res = await fetch(`${API_BASE}/api/uploads`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }, body: fd
                });
                if (checkUnauthorized(res)) continue;
                const d = await res.json().catch(() => ({}));
                if (d && d.data && d.data.media_id) ids.push(d.data.media_id);
            }
            return ids;
        }

        const cardMediaUrlCache = {};
        async function cardMediaUrl(id) {
            if (!id) return '';
            if (cardMediaUrlCache[id]) return cardMediaUrlCache[id];
            try {
                const res = await fetch(`${API_BASE}/api/media/${id}`, { headers: getAuthHeaders(false) });
                if (!res.ok) return '';
                const url = URL.createObjectURL(await res.blob());
                cardMediaUrlCache[id] = url;
                return url;
            } catch (e) { return ''; }
        }
        async function uploadAdminFile(file) {
            const fd = new FormData();
            fd.append('file', file);
            const res = await fetch(`${API_BASE}/api/uploads`, {
                method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }, body: fd
            });
            if (checkUnauthorized(res)) return null;
            const d = await res.json().catch(() => ({}));
            return d && d.data ? d.data.media_id : null;
        }
        function renderCardPhotos(eventId) {
            const grid = document.getElementById(`card-photos-${eventId}`);
            if (!grid) return;
            grid.innerHTML = '';
            const photos = window.cardPhotos[eventId] || [];
            photos.forEach((pid, i) => {
                const div = document.createElement('div');
                div.className = 'photo-thumb';
                cardMediaUrl(pid).then(url => {
                    div.innerHTML = `<img src="${url}" alt="照片"><span class="rm" onclick="removeCardPhoto('${eventId}', ${i})">×</span>`;
                });
                grid.appendChild(div);
            });
        }
        async function onPickCardPhoto(eventId, files) {
            window.cardPhotos[eventId] = window.cardPhotos[eventId] || [];
            const hint = document.getElementById(`card-photo-hint-${eventId}`);
            for (const f of Array.from(files || [])) {
                if (!f.type.startsWith('image/')) continue;
                const id = await uploadAdminFile(f);
                if (id) window.cardPhotos[eventId].push(id);
            }
            renderCardPhotos(eventId);
            const input = document.getElementById(`card-photo-input-${eventId}`);
            if (input) input.value = '';
            if (hint) hint.textContent = window.cardPhotos[eventId].length ? `已选 ${window.cardPhotos[eventId].length} 张` : '';
        }
        function removeCardPhoto(eventId, index) {
            window.cardPhotos[eventId].splice(index, 1);
            renderCardPhotos(eventId);
            const hint = document.getElementById(`card-photo-hint-${eventId}`);
            if (hint) hint.textContent = window.cardPhotos[eventId].length ? `已选 ${window.cardPhotos[eventId].length} 张` : '';
        }
        function resetCardPhotos(eventId) {
            window.cardPhotos[eventId] = [];
            window.cardText[eventId] = '';
        }

        async function startEvent(eventId) {
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/start`, { method: 'POST', headers: getAuthHeaders(false) });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { const err = await res.json().catch(() => ({})); alert((err.error || err.detail) || '开始处理失败'); return; }
                await loadData();
            } catch (e) { alert('网络请求失败'); }
        }

        async function completeEvent(eventId) {
            const el = document.getElementById(`reply-text-${eventId}`);
            const reply = el ? el.value.trim() : '';
            const photos = window.cardPhotos[eventId] || [];
            if (!photos.length) { alert('完成事件必须上传至少 1 张留证照片'); return; }
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/complete`, {
                    method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ reply, photos })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { const err = await res.json().catch(() => ({})); alert((err.error || err.detail) || '完成失败'); return; }
                resetCardPhotos(eventId);
                await loadData();
            } catch (e) { alert('网络请求失败'); }
        }

        async function changeType(eventId, type) {
            const ev = allEvents.find(x => x.event_id === eventId);
            if (!ev) return;
            if (type === ev.event_type) { await loadData(); return; }
            if (!confirm('确定将事件类型由「' + ev.event_type + '」改为「' + type + '」并自动重派？')) { await loadData(); return; }
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/type`, {
                    method: 'PATCH', headers: getAuthHeaders(), body: JSON.stringify({ event_type: type, urgency: ev.urgency || '' })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { const err = await res.json().catch(() => ({})); alert((err.error || err.detail) || '改类型失败'); }
                await loadData();
            } catch (e) { alert('网络请求失败'); }
        }

        async function changeDept(eventId, dept) {
            if (!dept) return;
            const ev = allEvents.find(x => x.event_id === eventId);
            if (ev && dept === ev.assigned_dept) { await loadData(); return; }
            if (!confirm('确定将该事件转交给所选部门？新部门需重新受理。')) { await loadData(); return; }
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/dept`, {
                    method: 'PATCH', headers: getAuthHeaders(), body: JSON.stringify({ department: dept })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { const err = await res.json().catch(() => ({})); alert((err.error || err.detail) || '改派失败'); }
                await loadData();
            } catch (e) { alert('网络请求失败'); }
        }

        async function loadUnread() {
            try {
                const res = await fetch(`${API_BASE}/api/notifications/unread`, { headers: getAuthHeaders(false) });
                if (checkUnauthorized(res)) return;
                if (!res.ok) return;
                const d = await res.json();
                const total = (d.pending || 0) + (d.new_reply || 0);
                const badge = document.getElementById('unreadBadge');
                badge.textContent = total;
                badge.classList.toggle('hidden', total === 0);
            } catch (e) {}
        }

        function populateDeptSelect() {
            const sel = document.getElementById('du-department');
            if (!sel) return;
            sel.innerHTML = Object.entries(DEPTS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
        }

        async function loadDeptUsers() {
            const box = document.getElementById('deptUsersList');
            if (!box) return;
            try {
                const res = await fetch(`${API_BASE}/api/admin/dept_users`, { headers: getAuthHeaders(false) });
                if (checkUnauthorized(res)) return;
                if (!res.ok) return;
                const users = await res.json();
                box.innerHTML = users.map(u => `<div class="review-beneficiary">${escapeHtml(u.real_name || u.username)} · ${escapeHtml(u.username)} · ${escapeHtml(u.department_name || '')} ${u.status === 'disabled' ? '· 已停用' : ''} <button class="btn-sm btn-reject" onclick="deleteDeptUser('${u.id}')">删除</button></div>`).join('') || '<div class="empty">暂无部门账号</div>';
            } catch (e) { box.innerHTML = '<div class="empty">加载失败</div>'; }
        }

        async function createDeptUser() {
            const username = document.getElementById('du-username').value.trim();
            const password = document.getElementById('du-password').value;
            const real_name = document.getElementById('du-real_name').value.trim();
            const phone = document.getElementById('du-phone').value.trim();
            const department = document.getElementById('du-department').value;
            if (!username || !password || !real_name || !phone || !department) { alert('请填写完整部门账号信息'); return; }
            const res = await fetch(`${API_BASE}/api/admin/dept_users`, {
                method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ username, password, real_name, phone, department })
            });
            if (checkUnauthorized(res)) return;
            const d = await res.json().catch(() => ({}));
            if (res.ok && d.success) { alert('部门账号已创建'); ['du-username','du-password','du-real_name','du-phone'].forEach(id => document.getElementById(id).value = ''); loadDeptUsers(); }
            else { alert((d && (d.error || d.detail)) || '创建失败'); }
        }

        async function deleteDeptUser(userId) {
            if (!confirm('确定删除该部门账号？账号与密码将一并删除，不可恢复。')) return;
            const res = await fetch(`${API_BASE}/api/admin/dept_users/${userId}`, {
                method: 'DELETE', headers: getAuthHeaders(false)
            });
            if (checkUnauthorized(res)) return;
            const d = await res.json().catch(() => ({}));
            if (res.ok) { alert('已删除'); loadDeptUsers(); }
            else { alert((d && (d.detail || d.error)) || '删除失败'); }
        }

        function renderReplyCell(e) {
            let txt = '';
            if (e.status === '已拒绝' && e.rejected_reason) {
                txt = e.rejected_reason;
            } else if (e.reply) {
                txt = e.reply;
            } else if (e.replies && e.replies.length) {
                txt = (e.replies[e.replies.length - 1].content || '');
            }
            if (!txt) return '<span class="muted">-</span>';
            const short = txt.length > 30 ? txt.slice(0, 30) + '…' : txt;
            return `<span class="reply-cell" title="${escapeHtml(txt)}">${escapeHtml(short)}</span>`;
        }

        // 渲染表格
        function renderTable(events) {
            const container = document.getElementById('tableContainer');
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="empty">暂无符合条件的事件</div>';
                document.getElementById('showingInfo').textContent = '共 0 条记录';
                return;
            }

            // 排序
            const sorted = [...events].sort((a, b) => {
                const av = a[currentSort.key] || '';
                const bv = b[currentSort.key] || '';
                if (av < bv) return currentSort.desc ? 1 : -1;
                if (av > bv) return currentSort.desc ? -1 : 1;
                return 0;
            });

            const rows = sorted.map(e => `
                <tr>
                    <td data-label="创建时间">${escapeHtml(e.created_at || '-')}</td>
                    <td data-label="描述">${beneficiaryTag(e)}${escapeHtml(e.description || '-')}</td>
                    <td data-label="类型">${escapeHtml(e.event_type || '-')}</td>
                    <td data-label="紧急程度"><span class="tag ${urgencyClass(e.urgency)}">${escapeHtml(e.urgency || '-')}</span></td>
                    <td data-label="场景标签"><span class="tag ${sceneClass(e.scene_tag)}">${escapeHtml(e.scene_tag || '-')}</span></td>
                    <td data-label="处理部门">${escapeHtml(e.handler || '-')}</td>
                    <td data-label="位置">${locationCell(e)}</td>
        <td data-label="status">${
          e.status === '已撤销'
            ? `<span class="tag ${statusClass('已撤销')}" title="撤回时间：${escapeHtml(e.withdrawn_at || '-')}">已撤销</span>`
            : e.status === '已拒绝'
            ? `<span class="tag ${statusClass('已拒绝')}" title="拒绝理由：${escapeHtml(e.rejected_reason || '-')}">拒绝</span>`
            : `<span class="tag ${statusClass(e.status)}">${escapeHtml(e.status || '-')}</span>`
        }</td>
        <td data-label="回复">${renderReplyCell(e)}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortBy('created_at')">创建时间<span class="sort-indicator">${sortIndicator('created_at')}</span></th>
                            <th onclick="sortBy('description')">描述<span class="sort-indicator">${sortIndicator('description')}</span></th>
                            <th onclick="sortBy('event_type')">类型<span class="sort-indicator">${sortIndicator('event_type')}</span></th>
                            <th onclick="sortBy('urgency')">紧急程度<span class="sort-indicator">${sortIndicator('urgency')}</span></th>
                            <th onclick="sortBy('scene_tag')">场景标签<span class="sort-indicator">${sortIndicator('scene_tag')}</span></th>
                            <th onclick="sortBy('handler')">处理部门<span class="sort-indicator">${sortIndicator('handler')}</span></th>
                            <th>位置</th>
                            <th onclick="sortBy('status')">状态<span class="sort-indicator">${sortIndicator('status')}</span></th>
                            <th>回复</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
            document.getElementById('showingInfo').textContent = `共 ${sorted.length} 条记录`;
        }

        // 提交者信息 tooltip
        function submitterTooltip(e) {
            const room = [e.user_building, e.user_unit, e.user_room].filter(Boolean).join("-");
            const idCard = e.user_id_card ? e.user_id_card.substring(0, 6) + "****" + e.user_id_card.substring(e.user_id_card.length - 4) : "-";
            return "姓名：" + (e.user_name || "-") + "\n手机：" + (e.user_phone || "-") + "\n身份证：" + idCard + "\n住址：" + (room || "-");
        }

        // 被代办人信息 tooltip
        function proxyTooltip(e) {
            const room = [e.beneficiary_building, e.beneficiary_unit, e.beneficiary_room].filter(Boolean).join("-");
            return "姓名：" + (e.beneficiary_name || "-") + "\n手机：" + (e.beneficiary_phone || "-") + "\n住址：" + (room || "-");
        }

        // 提交方式标签：显示提交者姓名 + 代办标识，带悬停提示
        function beneficiaryTag(e) {
            var subTip = escapeHtml(submitterTooltip(e));
            if (e.beneficiary_type === 'proxy') {
                var proTip = escapeHtml(proxyTooltip(e));
                return '<span class="tag tag-info" title="' + subTip + '">' + escapeHtml(e.user_name || "未知") + '</span> <span class="tag tag-warning" title="' + proTip + '">代办</span> ';
            }
            return '<span class="tag tag-info" title="' + subTip + '">' + escapeHtml(e.user_name || "未知") + '</span> ';
        }

        // 事件位置单元格：坐标 + 距中心米数 + 高德地图链接 + 定位状态徽章（仅管理员可见该数据）
        function locationCell(e) {
            if (e.event_lat == null || e.event_lng == null) {
                return '-';
            }
            const locBadge = e.event_location_status === 'verified'
                ? '<span class="loc-badge loc-ok">已验证</span>'
                : '<span class="loc-badge loc-warn">未验证</span>';
            const dist = (e.event_distance_m != null && e.event_distance_m >= 0)
                ? `<span class="loc-dist">距中心 ${Math.round(e.event_distance_m)} 米</span>`
                : '';
            const url = `https://uri.amap.com/marker?position=${e.event_lng},${e.event_lat}&name=${encodeURIComponent(e.description || '事件位置')}&src=community-grid`;
            return `<div class="loc-cell">${locBadge}<span class="loc-coords">${e.event_lat.toFixed(5)}, ${e.event_lng.toFixed(5)}</span>${dist}<a class="loc-link" href="${url}" target="_blank" rel="noopener">查看地图</a></div>`;
        }

        function sortIndicator(key) {
            if (currentSort.key !== key) {
                return '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 6 3.5-3 3.5 3M4.5 10l3.5 3 3.5-3"/></svg>';
            }
            if (currentSort.desc) {
                return '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v8M4.8 8.6 8 12l3.2-3.4"/></svg>';
            }
            return '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V4M4.8 7.4 8 4l3.2 3.4"/></svg>';
        }

        function sortBy(key) {
            if (currentSort.key === key) {
                currentSort.desc = !currentSort.desc;
            } else {
                currentSort.key = key;
                currentSort.desc = true;
            }
            applyFilters();
        }

        // 筛选逻辑
        function getFilteredEvents() {
            const statusFilter = document.getElementById('filterStatus').value;
            const typeFilter = document.getElementById('filterType').value;
            const urgencyFilter = document.getElementById('filterUrgency').value;
            const sceneFilter = document.getElementById('filterScene').value;

            return allEvents.filter(e => {
                if (statusFilter && e.status !== statusFilter) return false;
                if (typeFilter && e.event_type !== typeFilter) return false;
                if (urgencyFilter && e.urgency !== urgencyFilter) return false;
                if (sceneFilter && e.scene_tag !== sceneFilter) return false;
                return true;
            });
        }

        function applyFilters() {
            const filtered = getFilteredEvents();
            renderTable(filtered);
        }

        // 加载数据
        async function loadData() {
            try {
                const res = await fetch(`${API_BASE}/api/events`, {
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) throw new Error('请求失败');
                allEvents = await res.json();

                renderStats(allEvents);

                // 事件类型分布
                const typeCounts = countBy(allEvents, 'event_type');
                renderBarChart('typeChart', typeCounts);

                // 紧急程度分布（固定颜色映射）
                const urgencyCounts = countBy(allEvents, 'urgency');
                renderBarChart('urgencyChart', urgencyCounts, {
                    '高': 'red',
                    '中': 'orange',
                    '低': 'green'
                });

                // 场景标签分布
                const sceneCounts = countBy(allEvents, 'scene_tag');
                renderBarChart('sceneChart', sceneCounts, {
                    '生命急救': 'red',
                    '紧急救援': 'orange',
                    '常规': 'blue'
                });

                updateTypeFilterOptions(allEvents);
                applyFilters();
                renderReviewLists();
            } catch (e) {
                document.getElementById('typeChart').innerHTML = '<div class="empty">数据加载失败</div>';
                document.getElementById('urgencyChart').innerHTML = '<div class="empty">数据加载失败</div>';
                document.getElementById('sceneChart').innerHTML = '<div class="empty">数据加载失败</div>';
                document.getElementById('tableContainer').innerHTML = '<div class="empty">数据加载失败</div>';
            }
        }

        // 初始化：先认证，再加载数据
        initAuth().then(ok => {
            if (ok) {
                populateDeptSelect();
                loadData();
                loadUnread();
                loadCommunitySettings();
                if ((window.currentUser || {}).role === 'admin') loadDeptUsers();
                // 每 10 秒自动刷新一次，页面隐藏时暂停
                setInterval(() => {
                    if (document.hidden) return;
                    loadData();
                    loadUnread();
                }, 10000);
            }
        });
    </script>
</body>
</html>
