<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 知·社区网格</title>
    <link rel="stylesheet" href="/common.css">
    <style>
        /* ==========================================================================
           管理后台专属样式 · 复用 common.css 设计 token
           ========================================================================== */
        .container { max-width: 1200px; }

        /* ---- 统计卡片 ---- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stat-icon .icon { width: 20px; height: 20px; }
        .stat-icon.blue   { background: var(--accent-soft);  color: var(--accent); }
        .stat-icon.green  { background: var(--success-soft); color: var(--success); }
        .stat-icon.orange { background: var(--warning-soft); color: var(--warning); }
        .stat-icon.purple { background: var(--muted-soft);   color: var(--text-2); }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-1);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }
        .stat-label { font-size: 13px; color: var(--text-3); margin-top: 2px; }

        /* ---- 图表 ---- */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .bar-chart { display: flex; flex-direction: column; gap: 12px; }
        .bar-item { display: flex; align-items: center; gap: 10px; }
        .bar-label {
            width: 80px;
            font-size: 13px;
            color: var(--text-2);
            text-align: right;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: var(--surface-2);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: var(--radius-pill);
            transition: width 0.6s ease;
            min-width: 4px;
        }
        .bar-fill.blue   { background: var(--accent); }
        .bar-fill.red    { background: var(--danger); }
        .bar-fill.orange { background: var(--warning); }
        .bar-fill.green  { background: var(--success); }
        .bar-fill.purple { background: var(--accent); }
        .bar-fill.cyan   { background: var(--accent); }
        .bar-value {
            min-width: 28px;
            font-size: 13px;
            color: var(--text-2);
            font-weight: 600;
            flex-shrink: 0;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ---- 人工审核 ---- */
        .review-tabs {
            display: flex;
            gap: 4px;
            width: fit-content;
            padding: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            margin-bottom: 18px;
        }
        .review-tab {
            padding: 7px 18px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            background: transparent;
            color: var(--text-2);
            transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }
        .review-tab.active {
            background: var(--surface);
            color: var(--accent);
            font-weight: 600;
            box-shadow: var(--shadow);
        }
        .review-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--warning);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .review-card.accepted { border-left-color: var(--accent); }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .review-user {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--text-2);
        }
        .review-user strong { color: var(--text-1); }
        .user-meta {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-2);
        }
        .user-meta .icon { color: var(--text-3); }
        .review-desc {
            font-size: 15px;
            color: var(--text-1);
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .review-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* ---- 小型按钮 ---- */
        .btn-sm {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.12s ease;
        }
        .btn-sm:hover { background: var(--accent-hover); }
        .btn-sm:active { transform: scale(0.98); }
        .btn-sm.btn-accept { background: var(--accent); }
        .btn-sm.btn-done   { background: var(--success); }
        .btn-sm.btn-done:hover { filter: brightness(0.92); }
        .btn-sm.btn-refresh {
            background: var(--surface);
            color: var(--text-2);
            border: 1px solid var(--border-strong);
        }
        .btn-sm.btn-refresh:hover { background: var(--surface-2); color: var(--text-1); }

        /* ---- 回复输入区 ---- */
        .reply-box { margin-top: 12px; display: none; }
        .reply-box.visible { display: block; }
        .reply-box textarea { min-height: 60px; }
        .reply-box .btn-sm { margin-top: 8px; }

        /* ---- 同一用户多事件折叠 ---- */
        .review-collapsed { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
        .review-collapsed.visible { display: block; }
        .review-expand-btn { background: var(--surface-2); border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; margin-top: 10px; }
        .review-expand-btn:hover { background: var(--border-strong); }
        .collapsed-card { background: var(--surface-2); border-radius: 8px; padding: 12px; margin-top: 8px; border-left: 3px solid #d97706; }

        /* ---- 回复历史 ---- */
        .reply-history { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
        .reply-history-item { padding: 6px 0; }
        .reply-history-meta { font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
        .reply-history-content { font-size: 14px; color: var(--text-1); word-break: break-all; }

        /* ---- 筛选栏 ---- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 12px;
            margin-bottom: 18px;
        }
        .filter-bar label { font-size: 13px; color: var(--text-2); }
        .filter-bar select { width: auto; min-width: 118px; padding: 8px 10px; }
        .filter-bar .btn-refresh { margin-left: auto; }

        /* ---- 事件表格（可排序） ---- */
        #tableContainer table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        #tableContainer thead th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text-3);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        #tableContainer thead th:hover { color: var(--text-1); }
        #tableContainer tbody td {
            padding: 12px;
            border-top: 1px solid var(--border);
            color: var(--text-1);
            vertical-align: top;
        }
        #tableContainer tbody tr:hover { background: var(--surface-2); }
        .sort-indicator {
            display: inline-flex;
            margin-left: 5px;
            color: var(--text-3);
            vertical-align: -1px;
        }
        .sort-indicator .icon { width: 12px; height: 12px; }

        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-3);
        }

        /* ---- 移动端：表格转卡片 ---- */
        @media (max-width: 768px) {
            .filter-bar select,
            .filter-bar .btn-sm { min-height: 40px; }
            .filter-bar .btn-refresh { margin-left: 0; }
            #tableContainer table thead { display: none; }
            #tableContainer table,
            #tableContainer table tbody,
            #tableContainer table tr,
            #tableContainer table td { display: block; width: 100%; }
            #tableContainer table tr {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 12px 14px;
                margin-bottom: 12px;
                box-shadow: var(--shadow);
            }
            #tableContainer table tr:hover { background: var(--surface); }
            #tableContainer table td {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: flex-start;
                gap: 2px 12px;
                padding: 6px 0;
                border-top: none;
                font-size: 14px;
                overflow-wrap: anywhere;
            }
            #tableContainer table td::before {
                content: attr(data-label);
                color: var(--text-3);
                flex-shrink: 0;
                font-weight: 500;
            }
            #tableContainer table td:first-child { padding-top: 0; }
            #tableContainer table td:last-child { padding-bottom: 0; }
            .table-footer { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-title">
            知·社区网格
            <span class="topbar-sub">管理后台</span>
        </div>
        <div class="userbar">
            <div class="user-info">
                <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="4.6" r="2.4"/><path d="M2.8 13.5c.6-2.5 2.9-3.8 5.2-3.8s4.6 1.3 5.2 3.8"/></svg>
                <strong id="user-name">-</strong>
                <span class="role-tag admin" id="user-role">街道管理员</span>
            </div>
            <div class="user-actions">
                <a href="/">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3.5M7 4.5 3.5 8 7 11.5"/></svg>
                    返回事件提交页
                </a>
                <a onclick="logout()">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3H3.8A1.3 1.3 0 0 0 2.5 4.3v7.4A1.3 1.3 0 0 0 3.8 13h2.7"/><path d="M13.5 8H7M11 5.5l3 2.5-3 2.5"/></svg>
                    退出登录
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 统计卡片 -->
        <div class="stat-grid" id="statGrid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="7" height="10.5" rx="1.5"/><path d="M6.5 6h3M6.5 8.5h3M6.5 11h1.5"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-total">-</div>
                    <div class="stat-label">事件总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 11.5 6 8l2.3 2.3L13.5 5M10.3 5h3.2v3.2"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-today">-</div>
                    <div class="stat-label">今日新增</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.4"/><path d="M8 4.8V8l2.4 1.5"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-pending">-</div>
                    <div class="stat-label">待处理数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 8.4 6 11.5 13.2 4.3"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-done">-</div>
                    <div class="stat-label">已处理数</div>
                </div>
            </div>
        </div>

        <!-- 人工审核专区 -->
        <div class="card review-section">
            <h2>人工审核</h2>
            <div class="review-tabs">
                <button class="review-tab active" id="tab-pending" onclick="switchReviewTab('pending')">待审核</button>
                <button class="review-tab" id="tab-accepted" onclick="switchReviewTab('accepted')">已受理</button>
            </div>
            <div id="reviewPendingContainer">
                <div class="empty">加载中…</div>
            </div>
            <div id="reviewAcceptedContainer" style="display:none;">
                <div class="empty">加载中…</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-row">
            <div class="card chart-container">
                <h2>事件类型分布</h2>
                <div class="bar-chart" id="typeChart">
                    <div class="empty">加载中…</div>
                </div>
            </div>
            <div class="card chart-container">
                <h2>紧急程度分布</h2>
                <div class="bar-chart" id="urgencyChart">
                    <div class="empty">加载中…</div>
                </div>
            </div>
            <div class="card chart-container">
                <h2>场景标签分布</h2>
                <div class="bar-chart" id="sceneChart">
                    <div class="empty">加载中…</div>
                </div>
            </div>
        </div>

        <!-- 事件列表 -->
        <div class="card">
            <h2>事件列表</h2>
            <div class="filter-bar">
                <label>状态：</label>
                <select id="filterStatus">
                    <option value="">全部</option>
                    <option value="待审核">待审核</option>
                    <option value="已受理">已受理</option>
                    <option value="处理中">处理中</option>
                    <option value="已完成">已完成</option>
                    <option value="已派单">已派单</option>
                    <option value="处理超时">处理超时</option>
                    <option value="处理失败">处理失败</option>
                    <option value="已拒绝">已拒绝</option>
                </select>
                <label>类型：</label>
                <select id="filterType">
                    <option value="">全部</option>
                </select>
                <label>紧急程度：</label>
                <select id="filterUrgency">
                    <option value="">全部</option>
                    <option value="高">高</option>
                    <option value="中">中</option>
                    <option value="低">低</option>
                </select>
                <label>场景标签：</label>
                <select id="filterScene">
                    <option value="">全部</option>
                    <option value="生命急救">生命急救</option>
                    <option value="紧急救援">紧急救援</option>
                    <option value="常规">常规</option>
                </select>
                <button class="btn-sm" onclick="applyFilters()">筛选</button>
                <button class="btn-sm btn-refresh" onclick="loadData()">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 6.2A4.8 4.8 0 1 0 13 8"/><path d="M13.2 2.8V6h-3.2"/></svg>
                    刷新
                </button>
            </div>
            <div id="tableContainer">
                <div class="empty">加载中…</div>
            </div>
            <div class="table-footer">
                <span id="showingInfo">共 0 条记录</span>
                <span>数据实时来源于 GET /api/events</span>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let allEvents = [];
        let currentSort = { key: 'created_at', desc: true };

        // 内联极简线性 SVG 图标（stroke 1.5，currentColor）
        const ICON = {
            phone: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="6" y="2.5" width="4" height="11" rx="1.5"/><path d="M7.5 11.5h1"/></svg>',
            idcard: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2.5" y="4.5" width="11" height="7" rx="1.5"/><circle cx="6" cy="8" r="1.1"/><path d="M8.5 9.5h4M8.5 6.8h4"/></svg>'
        };

        // ------------------------------------------------------------------
        // 认证相关
        // ------------------------------------------------------------------
        function getAuthHeaders(contentType = true) {
            const headers = {};
            if (contentType) headers['Content-Type'] = 'application/json';
            const token = localStorage.getItem('token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        function checkUnauthorized(res) {
            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
                return true;
            }
            return false;
        }

        async function initAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            try {
                const res = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return false;
                if (!res.ok) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '/login.html';
                    return false;
                }
                const user = await res.json();
                if (user.role !== 'admin') {
                    alert('权限不足，仅管理员可访问后台管理页面');
                    window.location.href = '/';
                    return false;
                }
                document.getElementById('user-name').textContent = user.real_name || user.username;
                return true;
            } catch (e) {
                // 网络异常时暂不跳转，允许离线查看
                return true;
            }
        }

        async function logout() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    await fetch(`${API_BASE}/api/auth/logout`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (e) {
                    // 网络异常不影响本地登出
                }
            }
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // ------------------------------------------------------------------
        // 原有业务逻辑（仅增加认证头）
        // ------------------------------------------------------------------
        // 工具：统计对象
        function countBy(arr, key) {
            const map = {};
            for (const item of arr) {
                const val = item[key] || '未分类';
                map[val] = (map[val] || 0) + 1;
            }
            return map;
        }

        // 工具：获取今日日期字符串 YYYY-MM-DD
        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // 渲染统计卡片
        function renderStats(events) {
            const total = events.length;
            const today = todayStr();
            const todayCount = events.filter(e => (e.created_at || '').startsWith(today)).length;
            const pending = events.filter(e => e.status === '处理中' || e.status === '待审核' || e.status === '已受理').length;
            const done = events.filter(e => e.status === '已完成' || e.status === '已派单').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-today').textContent = todayCount;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-done').textContent = done;
        }

        // 渲染条形图
        function renderBarChart(containerId, dataMap, colorClassMap) {
            const container = document.getElementById(containerId);
            const entries = Object.entries(dataMap).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty">暂无数据</div>';
                return;
            }
            const maxVal = Math.max(...entries.map(e => e[1]));
            const colors = ['blue', 'green', 'orange', 'purple', 'red', 'cyan'];
            const html = entries.map((entry, idx) => {
                const label = entry[0];
                const val = entry[1];
                const pct = maxVal > 0 ? (val / maxVal * 100) : 0;
                const color = colorClassMap && colorClassMap[label] ? colorClassMap[label] : colors[idx % colors.length];
                return `
                    <div class="bar-item">
                        <div class="bar-label" title="${label}">${label}</div>
                        <div class="bar-track">
                            <div class="bar-fill ${color}" style="width: ${pct}%"></div>
                        </div>
                        <div class="bar-value">${val}</div>
                    </div>
                `;
            }).join('');
            container.innerHTML = html;
        }

        // 更新类型筛选下拉框选项
        function updateTypeFilterOptions(events) {
            const types = [...new Set(events.map(e => e.event_type).filter(Boolean))].sort();
            const select = document.getElementById('filterType');
            // 保留第一个"全部"选项
            select.innerHTML = '<option value="">全部</option>';
            for (const t of types) {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                select.appendChild(opt);
            }
        }

        // 标签样式工具
        function urgencyClass(u) {
            if (u === '高') return 'tag-high';
            if (u === '中') return 'tag-medium';
            return 'tag-low';
        }
        function statusClass(s) {
            if (s === '处理中') return 'tag-processing';
            if (s === '处理超时' || s === '处理失败' || s === '已拒绝') return 'tag-failed';
            if (s === '已完成' || s === '已派单') return 'tag-success';
            if (s === '待审核') return 'tag-pending';
            if (s === '已受理') return 'tag-accepted';
            return '';
        }
        function sceneClass(s) {
            if (s === '生命急救') return 'tag-scene-life';
            if (s === '紧急救援') return 'tag-scene-rescue';
            if (s === '常规') return 'tag-scene-normal';
            return '';
        }

        // ------------------------------------------------------------------
        // 人工审核专区
        // ------------------------------------------------------------------
        let currentReviewTab = 'pending';

        function switchReviewTab(tab) {
            currentReviewTab = tab;
            document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
            document.getElementById('tab-accepted').classList.toggle('active', tab === 'accepted');
            document.getElementById('reviewPendingContainer').style.display = tab === 'pending' ? 'block' : 'none';
            document.getElementById('reviewAcceptedContainer').style.display = tab === 'accepted' ? 'block' : 'none';
            renderReviewLists();
        }

        function renderReviewLists() {
            const pendingEvents = allEvents.filter(e => e.status === '待审核');
            const acceptedEvents = allEvents.filter(e => e.status === '已受理' || e.status === '已完成');

            // 保存折叠/展开状态，避免定时刷新时丢失
            const collapsedState = {};
            document.querySelectorAll('[id^="collapsed-"]').forEach(el => {
                collapsedState[el.id] = el.classList.contains('visible');
            });

            // 保存已受理输入框中用户正在输入的内容，避免定时刷新时丢失
            const savedReplies = {};
            const acceptedContainer = document.getElementById('reviewAcceptedContainer');
            acceptedContainer.querySelectorAll('textarea[id^="reply-text-"]').forEach(textarea => {
                const key = textarea.id.replace('reply-text-', '');
                if (textarea.value.trim()) {
                    savedReplies[key] = textarea.value;
                }
            });

            // 保存当前焦点位置和光标，避免重建DOM后光标消失
            let focusId = null;
            let selStart = 0;
            let selEnd = 0;
            const activeEl = document.activeElement;
            if (activeEl && acceptedContainer.contains(activeEl) && activeEl.tagName === 'TEXTAREA') {
                focusId = activeEl.id;
                selStart = activeEl.selectionStart;
                selEnd = activeEl.selectionEnd;
            }

            const pendingContainer = document.getElementById('reviewPendingContainer');
            if (pendingEvents.length === 0) {
                pendingContainer.innerHTML = '<div class="empty">暂无待审核事件</div>';
            } else {
                // 按身份证号分组，同一用户的多个事件折叠展示
                const grouped = {};
                for (const e of pendingEvents) {
                    const key = e.user_id_card || 'unknown';
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(e);
                }
                let html = '';
                for (const [idCard, events] of Object.entries(grouped)) {
                    const first = events[0];
                    const rest = events.slice(1);
                    const safeId = idCard.replace(/[^a-zA-Z0-9]/g, '_');
                    html += `
                        <div class="review-card" id="card-${first.created_at}">
                            <div class="review-header">
                                <div class="review-user">
                                    <strong>${first.user_name || '-'}</strong>
                                    <span class="user-meta">${ICON.phone}${first.user_phone || '-'}</span>
                                    <span class="user-meta">${ICON.idcard}${first.user_id_card || '-'}</span>
                                </div>
                                <div><span class="tag ${statusClass(first.status)}">${first.status}</span></div>
                            </div>
                            <div class="review-desc">${first.description || '-'}</div>
                            <div class="review-actions">
                                <button class="btn-sm btn-accept" onclick="acceptEvent('${first.created_at}')">受理</button>
                            </div>
                            <div class="reply-box" id="reply-box-${first.created_at}">
                                <textarea id="reply-text-${first.created_at}" placeholder="请输入回复内容"></textarea>
                                <button class="btn-sm btn-done" onclick="submitReply('${first.created_at}')">提交回复</button>
                            </div>
                    `;
                    if (rest.length > 0) {
                        html += `
                            <button class="review-expand-btn" id="expand-btn-${safeId}" onclick="toggleCollapsed('${safeId}')">展开该用户其余 ${rest.length} 条待审核事件</button>
                            <div class="review-collapsed" id="collapsed-${safeId}">
                        `;
                        for (const e of rest) {
                            html += `
                                <div class="collapsed-card" id="card-${e.created_at}">
                                    <div class="review-header">
                                        <div class="review-user">
                                            <strong>${e.user_name || '-'}</strong>
                                            <span class="user-meta">${ICON.phone}${e.user_phone || '-'}</span>
                                            <span class="user-meta">${ICON.idcard}${e.user_id_card || '-'}</span>
                                        </div>
                                        <div><span class="tag ${statusClass(e.status)}">${e.status}</span></div>
                                    </div>
                                    <div class="review-desc">${e.description || '-'}</div>
                                    <div class="review-actions">
                                        <button class="btn-sm btn-accept" onclick="acceptEvent('${e.created_at}')">受理</button>
                                    </div>
                                    <div class="reply-box" id="reply-box-${e.created_at}">
                                        <textarea id="reply-text-${e.created_at}" placeholder="请输入回复内容"></textarea>
                                        <button class="btn-sm btn-done" onclick="submitReply('${e.created_at}')">提交回复</button>
                                    </div>
                                </div>
                            `;
                        }
                        html += `</div>`;
                    }
                    html += `</div>`;
                }
                pendingContainer.innerHTML = html;
            }

            if (acceptedEvents.length === 0) {
                acceptedContainer.innerHTML = '<div class="empty">暂无已受理事件</div>';
            } else {
                acceptedContainer.innerHTML = acceptedEvents.map(e => `
                    <div class="review-card accepted" id="card-${e.created_at}">
                        <div class="review-header">
                            <div class="review-user">
                                <strong>${e.user_name || '-'}</strong>
                                <span class="user-meta">${ICON.phone}${e.user_phone || '-'}</span>
                                <span class="user-meta">${ICON.idcard}${e.user_id_card || '-'}</span>
                            </div>
                            <div><span class="tag ${statusClass(e.status)}">${e.status}</span></div>
                        </div>
                        <div class="review-desc">${e.description || '-'}</div>
                        ${(e.replies && e.replies.length > 0) ? `
                            <div class="reply-history">
                                ${e.replies.map(r => `
                                    <div class="reply-history-item">
                                        <div class="reply-history-meta">${r.reviewer_name || '管理员'} · ${r.created_at}</div>
                                        <div class="reply-history-content">${escapeHtml(r.content)}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        <div class="reply-box visible" id="reply-box-${e.created_at}">
                            <textarea id="reply-text-${e.created_at}" placeholder="请输入回复内容">${savedReplies[e.created_at] || ''}</textarea>
                            <button class="btn-sm btn-done" onclick="submitReply('${e.created_at}')">提交回复</button>
                        </div>
                    </div>
                `).join('');
            }

            // 恢复折叠状态
            Object.entries(collapsedState).forEach(([id, wasVisible]) => {
                const el = document.getElementById(id);
                if (el && wasVisible) {
                    el.classList.add('visible');
                    const btnId = id.replace('collapsed-', 'expand-btn-');
                    const btn = document.getElementById(btnId);
                    if (btn) btn.textContent = '收起';
                }
            });

            // 重新渲染后恢复焦点和光标位置
            if (focusId) {
                const newEl = document.getElementById(focusId);
                if (newEl) {
                    newEl.focus();
                    newEl.setSelectionRange(selStart, selEnd);
                }
            }
        }

        async function acceptEvent(createdAt) {
            const event = allEvents.find(e => e.created_at === createdAt);
            if (!event) return;
            // 用 created_at 作为临时标识查找 event_id（实际应该用 event_id）
            // 注意：当前 API 中没有返回 event_id，需要修改 list_events 返回 event_id
            // 先找到对应的 task
            const ev = allEvents.find(e => e.created_at === createdAt);
            if (!ev || !ev.event_id) {
                alert('找不到事件ID，请刷新页面');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/events/${ev.event_id}/accept`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || '受理失败');
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    // 成功受理后刷新数据
                    await loadData();
                }
            } catch (e) {
                alert('网络请求失败');
            }
        }

        function toggleReplyBox(createdAt) {
            const box = document.getElementById(`reply-box-${createdAt}`);
            if (box) box.classList.toggle('visible');
        }

        function toggleCollapsed(safeId) {
            const collapsed = document.getElementById('collapsed-' + safeId);
            const btn = document.getElementById('expand-btn-' + safeId);
            if (!collapsed || !btn) return;
            const isVisible = collapsed.classList.toggle('visible');
            btn.textContent = isVisible ? '收起' : '展开该用户其余 ' + (collapsed.children.length) + ' 条待审核事件';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        async function submitReply(createdAt) {
            const event = allEvents.find(e => e.created_at === createdAt);
            if (!event || !event.event_id) {
                alert('找不到事件ID，请刷新页面');
                return;
            }
            const textEl = document.getElementById(`reply-text-${createdAt}`);
            const reply = textEl ? textEl.value.trim() : '';
            if (!reply) {
                alert('请输入回复内容');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/events/${event.event_id}/reply`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ reply })
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || '提交失败');
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    alert('回复提交成功');
                    await loadData();
                }
            } catch (e) {
                alert('网络请求失败');
            }
        }

        // 渲染表格
        function renderTable(events) {
            const container = document.getElementById('tableContainer');
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="empty">暂无符合条件的事件</div>';
                document.getElementById('showingInfo').textContent = '共 0 条记录';
                return;
            }

            // 排序
            const sorted = [...events].sort((a, b) => {
                const av = a[currentSort.key] || '';
                const bv = b[currentSort.key] || '';
                if (av < bv) return currentSort.desc ? 1 : -1;
                if (av > bv) return currentSort.desc ? -1 : 1;
                return 0;
            });

            const rows = sorted.map(e => `
                <tr>
                    <td data-label="创建时间">${e.created_at || '-'}</td>
                    <td data-label="描述">${e.description || '-'}</td>
                    <td data-label="类型">${e.event_type || '-'}</td>
                    <td data-label="紧急程度"><span class="tag ${urgencyClass(e.urgency)}">${e.urgency || '-'}</span></td>
                    <td data-label="场景标签"><span class="tag ${sceneClass(e.scene_tag)}">${e.scene_tag || '-'}</span></td>
                    <td data-label="处理部门">${e.handler || '-'}</td>
                    <td data-label="状态"><span class="tag ${statusClass(e.status)}">${e.status || '-'}</span></td>
                </tr>
            `).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortBy('created_at')">创建时间<span class="sort-indicator">${sortIndicator('created_at')}</span></th>
                            <th onclick="sortBy('description')">描述<span class="sort-indicator">${sortIndicator('description')}</span></th>
                            <th onclick="sortBy('event_type')">类型<span class="sort-indicator">${sortIndicator('event_type')}</span></th>
                            <th onclick="sortBy('urgency')">紧急程度<span class="sort-indicator">${sortIndicator('urgency')}</span></th>
                            <th onclick="sortBy('scene_tag')">场景标签<span class="sort-indicator">${sortIndicator('scene_tag')}</span></th>
                            <th onclick="sortBy('handler')">处理部门<span class="sort-indicator">${sortIndicator('handler')}</span></th>
                            <th onclick="sortBy('status')">状态<span class="sort-indicator">${sortIndicator('status')}</span></th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
            document.getElementById('showingInfo').textContent = `共 ${sorted.length} 条记录`;
        }

        function sortIndicator(key) {
            if (currentSort.key !== key) {
                return '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 6 3.5-3 3.5 3M4.5 10l3.5 3 3.5-3"/></svg>';
            }
            if (currentSort.desc) {
                return '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v8M4.8 8.6 8 12l3.2-3.4"/></svg>';
            }
            return '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V4M4.8 7.4 8 4l3.2 3.4"/></svg>';
        }

        function sortBy(key) {
            if (currentSort.key === key) {
                currentSort.desc = !currentSort.desc;
            } else {
                currentSort.key = key;
                currentSort.desc = true;
            }
            applyFilters();
        }

        // 筛选逻辑
        function getFilteredEvents() {
            const statusFilter = document.getElementById('filterStatus').value;
            const typeFilter = document.getElementById('filterType').value;
            const urgencyFilter = document.getElementById('filterUrgency').value;
            const sceneFilter = document.getElementById('filterScene').value;

            return allEvents.filter(e => {
                if (statusFilter && e.status !== statusFilter) return false;
                if (typeFilter && e.event_type !== typeFilter) return false;
                if (urgencyFilter && e.urgency !== urgencyFilter) return false;
                if (sceneFilter && e.scene_tag !== sceneFilter) return false;
                return true;
            });
        }

        function applyFilters() {
            const filtered = getFilteredEvents();
            renderTable(filtered);
        }

        // 加载数据
        async function loadData() {
            try {
                const res = await fetch(`${API_BASE}/api/events`, {
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) throw new Error('请求失败');
                allEvents = await res.json();

                renderStats(allEvents);

                // 事件类型分布
                const typeCounts = countBy(allEvents, 'event_type');
                renderBarChart('typeChart', typeCounts);

                // 紧急程度分布（固定颜色映射）
                const urgencyCounts = countBy(allEvents, 'urgency');
                renderBarChart('urgencyChart', urgencyCounts, {
                    '高': 'red',
                    '中': 'orange',
                    '低': 'green'
                });

                // 场景标签分布
                const sceneCounts = countBy(allEvents, 'scene_tag');
                renderBarChart('sceneChart', sceneCounts, {
                    '生命急救': 'red',
                    '紧急救援': 'orange',
                    '常规': 'blue'
                });

                updateTypeFilterOptions(allEvents);
                applyFilters();
                renderReviewLists();
            } catch (e) {
                document.getElementById('typeChart').innerHTML = '<div class="empty">数据加载失败</div>';
                document.getElementById('urgencyChart').innerHTML = '<div class="empty">数据加载失败</div>';
                document.getElementById('sceneChart').innerHTML = '<div class="empty">数据加载失败</div>';
                document.getElementById('tableContainer').innerHTML = '<div class="empty">数据加载失败</div>';
            }
        }

        // 初始化：先认证，再加载数据
        initAuth().then(ok => {
            if (ok) {
                loadData();
                // 每 10 秒自动刷新一次
                setInterval(loadData, 10000);
            }
        });
    </script>
</body>
</html>
