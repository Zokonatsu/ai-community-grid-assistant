<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知·社区网格</title>
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.min.css">
</head>
<body>
    <!-- 顶部栏：左标题 + 右用户区 -->
    <div class="topbar">
        <div class="topbar-title" id="comm-title">
            知·社区网格
            <span class="topbar-sub">社区事件提交与派单</span>
        </div>

        <div class="userbar" id="userbar" style="display:none;">
            <div class="user-info">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.9 3.6-6.5 8-6.5s8 2.6 8 6.5"/></svg>
                欢迎，<strong id="user-name">-</strong>
                <span class="role-tag" id="user-role">-</span>
            </div>
            <div class="user-actions">
                <a onclick="logout()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                    <span>退出登录</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>事件提交</h2>
            <!-- 提交方式：文字描述 / 语音上报（二选一） -->
            <div class="tabs" id="mode-tabs">
                <div class="tab active" id="tab-mode-text" onclick="setSubmitMode('text')">文字描述</div>
                <div class="tab" id="tab-mode-voice" onclick="setSubmitMode('voice')">语音上报</div>
            </div>

            <!-- 文字描述模式：本人/代人办 + 描述 -->
            <div id="text-mode-section">
                <div class="tabs" id="beneficiary-tabs">
                    <div class="tab active" id="tab-self" onclick="setBeneficiaryType('self')">本人</div>
                    <div class="tab" id="tab-proxy" onclick="setBeneficiaryType('proxy')">代人办</div>
                </div>
                <div class="beneficiary-proxy hidden" id="beneficiary-proxy">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="proxy-name">被帮助人姓名</label>
                            <input type="text" id="proxy-name" placeholder="请输入真实姓名">
                        </div>
                        <div class="form-group">
                            <label for="proxy-phone">手机号</label>
                            <input type="tel" id="proxy-phone" placeholder="请输入11位手机号">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="proxy-building">楼栋</label>
                            <input type="text" id="proxy-building" placeholder="如：2栋">
                        </div>
                        <div class="form-group">
                            <label for="proxy-unit">单元</label>
                            <input type="text" id="proxy-unit" placeholder="如：3单元">
                        </div>
                        <div class="form-group">
                            <label for="proxy-room">房间号</label>
                            <input type="text" id="proxy-room" placeholder="如：401">
                        </div>
                    </div>
                </div>
                <textarea id="description" placeholder="请输入居民问题描述，例如：我家楼下下水道堵了"></textarea>
            </div>

            <!-- 语音上报模式：仅本人办，按住说话 -->
            <div id="voice-mode-section" class="hidden">
                <div class="voice-row">
                    <button type="button" class="btn recorder" id="recBtn">按住说话</button>
                    <span class="locate-hint" id="voiceHint"></span>
                </div>
                <div class="locate-hint">语音上报仅支持本人办，按住说话录音后提交</div>
            </div>

            <!-- 事件位置（本人默认取注册住址，可修改；代人办改为填被代办人地址） -->
            <div class="form-row" id="location-row">
                <div class="form-group"><label>楼栋</label><input type="text" id="ev-building" placeholder="如：2栋"></div>
                <div class="form-group"><label>单元</label><input type="text" id="ev-unit" placeholder="如：3单元"></div>
                <div class="form-group"><label>房间号</label><input type="text" id="ev-room" placeholder="如：401"></div>
            </div>
            <div class="form-row">
                <button type="button" class="btn-sm" onclick="openLocationPicker()">&#128205; 选择位置（可选）</button>
                <span class="locate-hint" id="locShow">未选择，可提交时定位</span>
                <input type="hidden" id="locAddrInput" value="">
            </div>
            <div class="photo-grid" id="photoGrid"></div>
            <div class="form-row">
                <button type="button" class="btn-sm" onclick="document.getElementById('photoInput').click()">&#128247; 添加照片（最多3张）</button>
                <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="onPickPhotos(this.files)">
            </div>
            <button class="btn" id="submitBtn" onclick="submitEvent()">提交处理</button>
            <div class="locate-hint" id="locateHint"></div>
            <div class="loading" id="loading" style="display:none;"><span class="dot"></span>正在处理，请稍候</div>
            <div class="error" id="error"></div>

            <!-- 异步轮询状态提示 -->
            <div class="polling hidden" id="polling">
                <div><span class="spinner"></span>事件已提交，正在处理中</div>
                <div class="polling-id">事件 ID：<span id="polling-id"></span></div>
            </div>

            <div class="result hidden" id="result">
                <div>处理结果</div>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="label">事件类型</div>
                        <div class="value" id="r-event_type"></div>
                    </div>
                    <div class="result-item">
                        <div class="label">紧急程度</div>
                        <div class="value" id="r-urgency"></div>
                    </div>
                    <div class="result-item">
                        <div class="label">处理部门</div>
                        <div class="value" id="r-handler"></div>
                    </div>
                    <div class="result-item">
                        <div class="label">状态</div>
                        <div class="value" id="r-status"></div>
                    </div>
                    <div class="result-item">
                        <div class="label">场景标签</div>
                        <div class="value" id="r-scene_tag"></div>
                    </div>
                    <div class="result-item">
                        <div class="label">创建时间</div>
                        <div class="value" id="r-created_at"></div>
                    </div>
                    <div class="result-item">
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>事件列表</h2>
            <div id="listContainer">
                <div class="empty">加载中</div>
            </div>
        </div>
    </div>

    <!-- 急救确认弹窗 -->
    <div class="overlay hidden" id="confirmOverlay">
        <div class="modal">
            <div class="modal-title is-danger" id="confirmTitle">急救确认</div>
            <div class="modal-text" id="confirmText"></div>
            <div class="modal-countdown" id="confirmCountdown">5 秒后自动确认</div>
            <div class="modal-legal" id="confirmLegal"></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="confirmCancel">取消</button>
                <button class="btn btn-danger" id="confirmAgree">同意</button>
            </div>
        </div>
    </div>

    <!-- 提交确认弹窗 -->
    <div class="overlay hidden" id="submitConfirmOverlay">
        <div class="modal">
            <div class="modal-title">确认提交信息</div>
            <div class="modal-content" id="submitConfirmContent"></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeSubmitConfirm()">取消</button>
                <button class="btn" onclick="confirmAndSubmit()">确认提交</button>
            </div>
        </div>
    </div>

    <!-- 事件详情时间线弹窗 -->
    <div class="overlay hidden" id="detailOverlay">
        <div class="modal">
            <div class="modal-close" onclick="closeDetail()" aria-label="关闭">&times;</div>
            <div class="modal-title">事件详情与时间线</div>
            <div class="modal-content" id="detailContent"></div>
        </div>
    </div>

    <!-- 回复查看弹窗 -->
    <div class="overlay hidden" id="replyOverlay">
        <div class="modal">
            <div class="modal-close" onclick="closeReplyDialog()" aria-label="关闭">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </div>
            <div class="modal-title" style="padding-left:32px;">人工回复</div>
            <div class="modal-content" id="replyText"></div>
        </div>
    </div>

    <!-- 图片查看器 -->
    <div class="overlay hidden" id="photoLightbox" onclick="closePhoto()">
        <div class="lightbox" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closePhoto()" aria-label="关闭">&times;</span>
            <img id="photoLightboxImg" src="" alt="照片">
        </div>
    </div>

    <!-- 地图选点弹窗 -->
    <div class="overlay hidden" id="locationPickerOverlay">
        <div class="modal" style="max-width:96vw;max-height:92vh;width:100%;" onclick="event.stopPropagation()">
            <span class="modal-close" style="left:auto;right:12px;top:12px;" onclick="closeLocationPicker()" aria-label="关闭">&times;</span>
            <div class="modal-title" style="padding-left:0;">选择位置</div>
            <div class="form-row" style="margin-bottom:6px;">
                <input type="text" id="locSearch" placeholder="搜索地点，回车确认" style="flex:1;" onkeydown="if(event.key==='Enter'){event.preventDefault();locSearchGo();}">
                <span class="locate-hint" id="locSearchHint"></span>
            </div>
            <div id="locTips" class="loc-tips" style="display:none;"></div>
            <div id="locMap" style="height:50vh;border:1px solid var(--border);border-radius:8px;"></div>
            <div class="form-row" style="margin:8px 0;">
                <input type="text" id="locAddr" placeholder="已选地址（拖动图钉/搜索自动带出）" readonly style="flex:1;">
            </div>
            <div class="modal-buttons">
                <button class="btn-sm btn-ghost" onclick="closeLocationPicker()">取消</button>
                <button class="btn-sm" onclick="confirmLocation()">发送</button>
            </div>
        </div>
    </div>

    <!-- 强制公告弹窗（无关闭叉，仅已阅读） -->
    <div class="overlay hidden" id="announcementOverlay">
        <div class="modal">
            <div class="modal-title" style="padding-left:0;">公告</div>
            <div class="modal-content" id="announcementContent" style="max-height:60vh;overflow-y:auto;"></div>
            <div class="modal-buttons">
                <button class="btn" onclick="markAnnouncementRead()">已阅读</button>
            </div>
        </div>
    </div>

    <script src="/vendor/leaflet/leaflet.min.js"></script>
    <script>
        const API_BASE = '';

        // 社区名称动态化：标题/页头随后台设置更新
        (function () {
            fetch(API_BASE + '/api/community')
                .then(r => (r.ok ? r.json() : null))
                .then(cfg => {
                    if (cfg && cfg.name) {
                        var t = cfg.name + '网格';
                        document.title = t;
                        var el = document.getElementById('comm-title');
                        if (el) el.textContent = t;
                    }
                })
                .catch(function () {});
        })();
        let pollTimer = null;
        let confirmTimer = null;
        let confirmSeconds = 5;
        let currentDesc = '';
        let currentEmergencyType = '';
        let confirmSubmitting = false;
        let listPollTimer = null;
        const POLL_LIST_MS = 15000;

        // ------------------------------------------------------------------
        // 认证相关
        // ------------------------------------------------------------------
        function getAuthHeaders(contentType = true) {
            const headers = {};
            if (contentType) headers['Content-Type'] = 'application/json';
            const token = localStorage.getItem('token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        // 浏览器定位封装：成功返回 {lat,lng}，失败/拒绝返回 null（不阻塞提交）
        function getPosition() {
            return new Promise(resolve => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                let done = false;
                const finish = v => { if (!done) { done = true; resolve(v); } };
                try {
                    navigator.geolocation.getCurrentPosition(
                        pos => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                        () => finish(null),
                        { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
                    );
                } catch (e) {
                    // 非安全上下文/部分浏览器会同步抛异常：兜底为不可用，避免提交流程卡死
                    finish(null);
                }
            });
        }

        function checkUnauthorized(res) {
            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
                return true;
            }
            return false;
        }

        // ------------------------------------------------------------------
        // 提交方式：本人 / 代人办
        // ------------------------------------------------------------------
        function setBeneficiaryType(type) {
            const isProxy = type === 'proxy';
            document.getElementById('tab-self').classList.toggle('active', !isProxy);
            document.getElementById('tab-proxy').classList.toggle('active', isProxy);
            document.getElementById('beneficiary-proxy').classList.toggle('hidden', !isProxy);
            // 代人办时只显示被代办人地址，隐藏本人(事件)地址
            const loc = document.getElementById('location-row');
            if (loc) loc.classList.toggle('hidden', isProxy);
        }

        function collectBeneficiary() {
            const isProxy = document.getElementById('tab-proxy').classList.contains('active');
            if (!isProxy) return { beneficiary_type: 'self' };
            const fields = {
                beneficiary_type: 'proxy',
                beneficiary_name: document.getElementById('proxy-name').value.trim(),
                beneficiary_phone: document.getElementById('proxy-phone').value.trim(),
                beneficiary_building: document.getElementById('proxy-building').value.trim(),
                beneficiary_unit: document.getElementById('proxy-unit').value.trim(),
                beneficiary_room: document.getElementById('proxy-room').value.trim()
            };
            const missing = [];
            if (!fields.beneficiary_name) missing.push('姓名');
            if (!fields.beneficiary_phone) missing.push('手机号');
            if (!fields.beneficiary_building) missing.push('楼栋');
            if (!fields.beneficiary_unit) missing.push('单元');
            if (!fields.beneficiary_room) missing.push('房间号');
            if (missing.length) {
                return { error: '代人办请填写被帮助人的' + missing.join('、') };
            }
            return fields;
        }

        function clearBeneficiary() {
            ['proxy-name', 'proxy-phone', 'proxy-building', 'proxy-unit', 'proxy-room'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
        }

        async function initAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            try {
                const res = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return false;
                if (!res.ok) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '/login.html';
                    return false;
                }
                const user = await res.json();
                window.currentUser = user;
                if (user.building) document.getElementById('ev-building').value = user.building;
                if (user.unit) document.getElementById('ev-unit').value = user.unit;
                if (user.room) document.getElementById('ev-room').value = user.room;
                // 管理员/部门账号不进入事件提交页，直接进入管理后台
                if (user.role === 'admin' || user.role === 'dept') {
                    window.location.href = '/admin.html';
                    return false;
                }
                // 显示用户栏
                document.getElementById('userbar').style.display = 'flex';
                document.getElementById('user-name').textContent = user.real_name || user.username;
                const roleEl = document.getElementById('user-role');
                roleEl.textContent = '居民';
                roleEl.className = 'role-tag resident';
                return true;
            } catch (e) {
                // 网络异常时暂不跳转，允许离线查看已缓存内容
                return true;
            }
        }

        async function logout() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    await fetch(`${API_BASE}/api/auth/logout`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (e) {
                    // 网络异常不影响本地登出
                }
            }
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let currentReplyEventId = null;

        async function handleReplyClick(eventId) {
            const event = window.userEvents && window.userEvents.find(e => e.event_id === eventId);
            if (!event) return;
            currentReplyEventId = eventId;

            const replies = event.replies || [];
            let html = '';
            if (replies.length === 0 && event.reply) {
                html = `<div class="reply-item"><div class="reply-content">${escapeHtml(event.reply)}</div></div>`;
            } else if (replies.length > 0) {
                for (const r of replies) {
                    let photosHtml = '';
                    if (r.photos && r.photos.length) {
                        const thumbs = [];
                        for (const p of r.photos) {
                            const u = await mediaUrl(p);
                            if (u) thumbs.push(`<img class="tl-photo" src="${u}" alt="照片" onclick="openPhoto('${u}');event.stopPropagation()">`);
                        }
                        if (thumbs.length) photosHtml = `<div class="tl-photos">${thumbs.join('')}</div>`;
                    }
                    html += `<div class="reply-item">
                        <div class="reply-meta">${escapeHtml(r.reviewer_name || '管理员')} · ${escapeHtml(r.created_at)}</div>
                        <div class="reply-content">${escapeHtml(r.content)}</div>
                        ${photosHtml}
                    </div>`;
                }
            } else {
                html = '<div class="reply-content">暂无回复</div>';
            }
            document.getElementById('replyText').innerHTML = html;
            document.getElementById('replyOverlay').classList.remove('hidden');
            _syncBodyScroll();
        }

        function closeReplyDialog() {
            document.getElementById('replyOverlay').classList.add('hidden');
            _syncBodyScroll();
            if (currentReplyEventId) {
                markRead(currentReplyEventId);
                currentReplyEventId = null;
            }
        }

        async function fillReplyThumbs() {
            const thumbs = document.querySelectorAll('.reply-thumb[data-event]');
            for (const el of thumbs) {
                const eid = el.getAttribute('data-event');
                const ev = (window.userEvents || []).find(x => x.event_id === eid);
                if (!ev) continue;
                const withPhoto = (ev.replies || []).find(r => (r.photos && r.photos.length));
                if (!withPhoto) continue;
                try {
                    const u = await mediaUrl(withPhoto.photos[0]);
                    if (u) el.innerHTML = `<img class="reply-thumb-img" src="${u}" alt="照片" title="查看回复照片" onclick="event.stopPropagation();handleReplyClick('${eid}')" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;vertical-align:middle;margin-left:6px;">`;
                } catch (e) {}
            }
        }

        let __miniAudio = null;
        async function fillMediaCells() {
            const photoEls = document.querySelectorAll('.media-photo[data-photo]');
            for (const el of photoEls) {
                const mid = el.getAttribute('data-photo');
                const eid = el.getAttribute('data-event');
                try {
                    const u = await mediaUrl(mid);
                    if (u) el.innerHTML = `<img class="media-photo-img" src="${u}" alt="照片" title="点击查看大图" onclick="openPhoto('${u}');event.stopPropagation()">`;
                } catch (e) {}
            }
            const audioEls = document.querySelectorAll('.media-audio-btn[data-audio]');
            for (const el of audioEls) {
                const mid = el.getAttribute('data-audio');
                const eid = el.getAttribute('data-event');
                try {
                    const u = await mediaUrl(mid);
                    if (u) { el.setAttribute('data-src', u); el.onclick = () => toggleMiniAudio(u, el, eid); }
                } catch (e) {}
            }
        }
        function toggleMiniAudio(src, btn, eid) {
            if (!__miniAudio) __miniAudio = new Audio();
            if (__miniAudio.src === src && !__miniAudio.paused) { __miniAudio.pause(); btn.textContent = '▶ 录音'; return; }
            __miniAudio.src = src;
            __miniAudio.play();
            btn.textContent = '⏸ 暂停';
            __miniAudio.onended = () => { btn.textContent = '▶ 录音'; };
        }

        function _syncBodyScroll() {
            const ids = ['replyOverlay', 'detailOverlay', 'photoLightbox', 'announcementOverlay', 'locationPickerOverlay'];
            const anyOpen = ids.some(id => { const el = document.getElementById(id); return el && !el.classList.contains('hidden'); });
            document.body.classList.toggle('modal-lock', anyOpen);
        }

        function openPhoto(url) {
            document.getElementById('photoLightboxImg').src = url;
            document.getElementById('photoLightbox').classList.remove('hidden');
        }
        function closePhoto() {
            document.getElementById('photoLightbox').classList.add('hidden');
            document.getElementById('photoLightboxImg').src = '';
        }

        async function markRead(eventId) {
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/mark_read`, {
                    method: 'POST',
                    headers: getAuthHeaders(false)
                });
                if (res.ok) {
                    await loadList();
                }
            } catch (e) {
                console.error('标记已读失败', e);
            }
        }

        // ------------------------------------------------------------------
        // 事件提交与轮询（原有逻辑，仅增加认证头）
        // ------------------------------------------------------------------
        let pendingSubmit = null;
        let listPage = 1;
        const LIST_PAGE_SIZE = 20;

        // ------------------------------------------------------------------
        // 提交确认弹窗：本人/代人办提交前先确认信息
        // ------------------------------------------------------------------
        let submitMode = 'text';
        function setSubmitMode(mode) {
            submitMode = mode;
            document.getElementById('tab-mode-text').classList.toggle('active', mode === 'text');
            document.getElementById('tab-mode-voice').classList.toggle('active', mode === 'voice');
            document.getElementById('text-mode-section').classList.toggle('hidden', mode !== 'text');
            document.getElementById('voice-mode-section').classList.toggle('hidden', mode !== 'voice');
            if (mode === 'text') {
                // 移除已录录音，保留照片；若在录音则停止
                mediaIds = mediaIds.filter(id => !isAudio(id));
                renderPhotoGrid();
                if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
            } else {
                // 清空描述，强制本人办
                document.getElementById('description').value = '';
                setBeneficiaryType('self');
                prewarmMic();
            }
        }

        async function submitEvent() {
            const error = document.getElementById('error');
            error.textContent = '';
            let desc = '';
            let beneficiary;
            if (submitMode === 'text') {
                desc = document.getElementById('description').value.trim();
                if (!desc) { error.textContent = '请输入居民问题描述'; return; }
                beneficiary = collectBeneficiary();
                if (beneficiary.error) { error.textContent = beneficiary.error; return; }
            } else {
                // 语音上报：必须已录录音，仅本人办
                if (!mediaIds.some(id => isAudio(id))) { error.textContent = '请按住说话录制语音后再提交'; return; }
                desc = '';
                beneficiary = { beneficiary_type: 'self' };
            }
            pendingSubmit = { desc, beneficiary };
            showSubmitConfirm(desc, beneficiary);
        }

        function showSubmitConfirm(desc, beneficiary) {
            const rows = [];
            rows.push(`<div class="confirm-row"><span class="confirm-label">事件描述</span><span class="confirm-value">${desc ? escapeHtml(desc) : '（语音上报，以录音为准）'}</span></div>`);
            if (beneficiary.beneficiary_type === 'proxy') {
                rows.push('<div class="confirm-row"><span class="confirm-label">提交方式</span><span class="confirm-value">代人办</span></div>');
                rows.push(`<div class="confirm-row"><span class="confirm-label">被帮助人</span><span class="confirm-value">${escapeHtml(beneficiary.beneficiary_name)} · ${escapeHtml(beneficiary.beneficiary_phone)} · ${escapeHtml(beneficiary.beneficiary_building)}${escapeHtml(beneficiary.beneficiary_unit)}${escapeHtml(beneficiary.beneficiary_room)}</span></div>`);
            } else {
                const u = window.currentUser || {};
                const addr = [u.building, u.unit, u.room].filter(Boolean).join('');
                const who = escapeHtml(u.real_name || u.username || '本人') + (addr ? ' · ' + escapeHtml(addr) : '');
                rows.push(`<div class="confirm-row"><span class="confirm-label">提交人</span><span class="confirm-value">${who}</span></div>`);
            }
            document.getElementById('submitConfirmContent').innerHTML = rows.join('');
            document.getElementById('submitConfirmOverlay').classList.remove('hidden');
        }

        function closeSubmitConfirm() {
            document.getElementById('submitConfirmOverlay').classList.add('hidden');
            pendingSubmit = null;
        }

        async function confirmAndSubmit() {
            if (!pendingSubmit) return;
            const { desc, beneficiary } = pendingSubmit;
            pendingSubmit = null;
            document.getElementById('submitConfirmOverlay').classList.add('hidden');
            await doSubmit(desc, beneficiary);
        }

        // 实际提交：获取定位 + POST + 处理响应（本人/代人办共用；急救确认后再调用带 extra）
        async function doSubmit(desc, beneficiary, extra) {
            const btn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            const polling = document.getElementById('polling');

            error.textContent = '';
            btn.disabled = true;
            loading.style.display = 'block';
            result.classList.add('hidden');
            polling.classList.add('hidden');
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

            try {
                // 提交时获取实时定位（失败/拒绝不阻塞提交）
                const pos = await getPosition();
                const hint = document.getElementById('locateHint');
                if (pos) {
                    hint.textContent = `已获取实时定位（${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}）`;
                } else {
                    hint.textContent = '定位不可用，事件仍可提交';
                }
                const res = await fetch(`${API_BASE}/api/events`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        description: desc,
                        lat: (pickedLoc && pickedLoc.lat != null) ? pickedLoc.lat : (pos ? pos.lat : null),
                        lng: (pickedLoc && pickedLoc.lng != null) ? pickedLoc.lng : (pos ? pos.lng : null),
                        address: (pickedLoc && pickedLoc.address) ? pickedLoc.address : '',
                        building: (beneficiary && beneficiary.beneficiary_type === 'proxy')
                            ? (beneficiary.beneficiary_building || '')
                            : document.getElementById('ev-building').value.trim(),
                        unit: (beneficiary && beneficiary.beneficiary_type === 'proxy')
                            ? (beneficiary.beneficiary_unit || '')
                            : document.getElementById('ev-unit').value.trim(),
                        room: (beneficiary && beneficiary.beneficiary_type === 'proxy')
                            ? (beneficiary.beneficiary_room || '')
                            : document.getElementById('ev-room').value.trim(),
                        media_ids: mediaIds,
                        ...(extra || {}),
                        ...beneficiary
                    })
                });
                if (checkUnauthorized(res)) return;
                const data = await res.json();
                if (!data.success) {
                    error.textContent = data.error || '处理失败';
                    btn.disabled = false;
                    loading.style.display = 'none';
                    return;
                }
                const d = data.data;
                // 模糊急救确认
                if (d.confirmation_required) {
                    btn.disabled = false;
                    loading.style.display = 'none';
                    showConfirmDialog(desc, d.emergency_type);
                    return;
                }
                // 终态判断：若后端已直接返回最终结果，立即展示，无需轮询
                const terminalStatuses = ['已完成', '已派单', '待审核', '待处理', '已受理', '处理中', '处理超时', '处理失败', '已拒绝'];
                if (terminalStatuses.includes(d.status)) {
                    document.getElementById('r-event_type').textContent = d.event_type || '-';
                    document.getElementById('r-urgency').textContent = d.urgency || '-';
                    document.getElementById('r-handler').textContent = d.handler || '-';
                    document.getElementById('r-status').textContent = d.status || '-';
                    document.getElementById('r-scene_tag').textContent = d.scene_tag || '-';
                    document.getElementById('r-created_at').textContent = d.created_at || '-';
                    
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('description').value = '';
                    clearBeneficiary();
                    resetMedia();
                    loadList();
                    btn.disabled = false;
                    loading.style.display = 'none';
                    return;
                }
                // 异步处理中：展示轮询状态并启动轮询
                document.getElementById('polling-id').textContent = d.event_id;
                polling.classList.remove('hidden');
                document.getElementById('description').value = '';
                clearBeneficiary();
                resetMedia();
                loadList();
                startPolling(d.event_id);
            } catch (e) {
                error.textContent = '网络请求失败，请检查服务是否启动';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // ------------------------------------------------------------------
        // 模糊急救确认弹窗
        // ------------------------------------------------------------------
        function showConfirmDialog(desc, emergencyType) {
            currentDesc = desc;
            currentEmergencyType = emergencyType;
            confirmSeconds = 5;

            const titleEl = document.getElementById('confirmTitle');
            const textEl = document.getElementById('confirmText');
            const countdownEl = document.getElementById('confirmCountdown');
            const legalEl = document.getElementById('confirmLegal');

            let text = '';
            if (emergencyType === 'medical') {
                text = '您反映的情况属于生命医疗急救，系统将在5秒后向120医疗急救中心求助，是否同意？';
            } else if (emergencyType === 'police') {
                text = '您反映的情况属于公安急救，系统将在5秒后向110公安急救中心求助，是否同意？';
            } else if (emergencyType === 'fire') {
                text = '您反映的情况属于消防急救，系统将在5秒后向119消防急救中心求助，是否同意？';
            } else {
                text = '您反映的情况属于急救事件，系统将在5秒后向相关部门求助，是否同意？';
            }
            titleEl.textContent = '急救确认';
            textEl.textContent = text;
            countdownEl.textContent = confirmSeconds + ' 秒后自动确认';
            legalEl.textContent = '注意：恶意虚报、滥用急救资源将承担相应法律责任。';

            const agreeBtn = document.getElementById('confirmAgree');
            const cancelBtn = document.getElementById('confirmCancel');

            // 移除旧监听，避免重复绑定
            const newAgreeBtn = agreeBtn.cloneNode(true);
            const newCancelBtn = cancelBtn.cloneNode(true);
            agreeBtn.parentNode.replaceChild(newAgreeBtn, agreeBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newAgreeBtn.addEventListener('click', onConfirmAgree);
            newCancelBtn.addEventListener('click', onConfirmCancel);

            document.getElementById('confirmOverlay').classList.remove('hidden');

            if (confirmTimer) clearInterval(confirmTimer);
            confirmTimer = setInterval(() => {
                confirmSeconds--;
                document.getElementById('confirmCountdown').textContent = confirmSeconds + ' 秒后自动确认';
                if (confirmSeconds <= 0) {
                    clearInterval(confirmTimer);
                    confirmTimer = null;
                    onConfirmAgree();
                }
            }, 1000);
        }

        function closeConfirmDialog() {
            if (confirmTimer) {
                clearInterval(confirmTimer);
                confirmTimer = null;
            }
            document.getElementById('confirmOverlay').classList.add('hidden');
        }

        async function onConfirmAgree() {
            if (confirmSubmitting) return;
            confirmSubmitting = true;
            try {
                closeConfirmDialog();
                const beneficiary = collectBeneficiary();
                if (beneficiary.error) {
                    document.getElementById('error').textContent = beneficiary.error;
                    return;
                }
                await doSubmit(currentDesc, beneficiary, { confirmed: true, emergency_type: currentEmergencyType });
            } finally {
                confirmSubmitting = false;
            }
        }

        function onConfirmCancel() {
            closeConfirmDialog();
            document.getElementById('error').textContent = '已取消';
        }

        function startPolling(eventId) {
            if (pollTimer) clearInterval(pollTimer);
            let pollCount = 0;
            const maxPolls = 20; // 最多轮询20次（约60秒），防止无限轮询

            const check = async () => {
                pollCount++;
                try {
                    const res = await fetch(`${API_BASE}/api/events/${eventId}`, {
                        headers: getAuthHeaders(false)
                    });
                    if (checkUnauthorized(res)) return;
                    if (!res.ok) {
                        if (res.status === 404) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                            document.getElementById('polling').classList.add('hidden');
                            document.getElementById('error').textContent = '事件不存在或已被移除';
                            loadList();
                        }
                        return;
                    }
                    const d = await res.json();

                    // 调试输出：便于排查 status 字段实际值
                    console.log(`[轮询 ${pollCount}] event_id=${eventId}, status="${d.status}"`);

                    if (['已完成', '已派单', '待审核', '待处理', '已受理', '处理中', '已拒绝'].includes(d.status)) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        // 隐藏轮询提示，展示结果（与同步提交路径一致，含"已拒绝"）
                        document.getElementById('polling').classList.add('hidden');
                        document.getElementById('r-event_type').textContent = d.event_type || '-';
                        document.getElementById('r-urgency').textContent = d.urgency || '-';
                        document.getElementById('r-handler').textContent = d.handler || '-';
                        document.getElementById('r-status').textContent = d.status || '-';
                        document.getElementById('r-scene_tag').textContent = d.scene_tag || '-';
                        document.getElementById('r-created_at').textContent = d.created_at || '-';
                        
                        document.getElementById('result').classList.remove('hidden');
                        loadList();
                    } else if (d.status === '处理超时' || d.status === '处理失败') {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        document.getElementById('polling').classList.add('hidden');
                        const errMsg = d.error || '处理超时，请稍后刷新或重新提交';
                        document.getElementById('error').textContent = errMsg;
                        loadList();
                    } else if (pollCount >= maxPolls) {
                        // 兜底：超过最大轮询次数，强制结束并提示刷新
                        clearInterval(pollTimer);
                        pollTimer = null;
                        document.getElementById('polling').classList.add('hidden');
                        document.getElementById('error').textContent = '事件正在处理中，请稍后刷新列表查看最新状态';
                        loadList();
                    } else {
                        // 未知状态（如"处理中"）继续轮询，直到达到最大次数
                    }
                } catch (e) {
                    // 轮询出错不中断，继续等待下次
                }
            };

            check(); // 立即查一次
            pollTimer = setInterval(check, 3000);
        }

        // ------------------------------------------------------------------
        // 事件撤销：操作列（提交后 5 分钟内可撤销，不看事件状态，
        //           已撤销除外；超过 5 分钟 -> 灰色「已执行」）
        // ------------------------------------------------------------------
        let cancelTickTimer = null;
        const CANCEL_WINDOW_MS = 300 * 1000;

        function eventExpired(createdAt) {
            if (!createdAt) return true;
            const t = new Date(String(createdAt).replace(' ', 'T'));
            if (isNaN(t.getTime())) return true;
            return (Date.now() - t.getTime()) > CANCEL_WINDOW_MS;
        }

        function renderActionCell(e) {
            if (e.status === '已撤销') {
                return '<span class="tag tag-cancelled">已撤销</span>';
            }
            if (!eventExpired(e.created_at)) {
                return `<button type="button" class="btn btn-sm btn-cancel-event" onclick="cancelEvent('${e.event_id}')">撤销</button>`;
            }
            return '<button type="button" class="btn btn-sm" disabled title="已超过可撤销时限">已执行</button>';
        }

        async function cancelEvent(eventId) {
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}/cancel`, {
                    method: 'POST',
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return;
                let detail = '';
                try {
                    const data = await res.json();
                    detail = data.detail || data.error || '';
                } catch (e) { /* 非 JSON 响应时忽略 */ }
                if (res.ok) {
                    loadList();
                } else {
                    alert(detail || `撤销失败（HTTP ${res.status}）`);
                    loadList();
                }
            } catch (e) {
                alert('网络请求失败，请稍后重试');
            }
        }

        // 5 分钟边界自动变灰：本地定时器按 created_at 周期重算操作列（≤60 秒）
        function startCancelTick() {
            if (cancelTickTimer) clearInterval(cancelTickTimer);
            cancelTickTimer = setInterval(() => {
                const events = window.userEvents || [];
                events.forEach(e => {
                    const row = document.querySelector(`#listContainer tr[data-event-id="${e.event_id}"]`);
                    if (!row) return;
                    const td = row.querySelector('td[data-label="操作"]');
                    if (td) td.innerHTML = renderActionCell(e);
                });
            }, 30000);
        }

        function paginationHtml(page, total) {
            if (total <= 1) return '';
            let btns = '';
            const start = Math.max(1, page - 2);
            const end = Math.min(total, page + 2);
            for (let i = start; i <= end; i++) {
                btns += `<button class="p-btn ${i === page ? 'active' : ''}" onclick="goListPage(${i})">${i}</button>`;
            }
            return `<button class="p-btn" onclick="goListPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>上一页</button>${btns}<button class="p-btn" onclick="goListPage(${page + 1})" ${page >= total ? 'disabled' : ''}>下一页</button>`;
        }
        function goListPage(n) { listPage = n; loadList(true); }

        async function loadList(quiet = false) {
            const container = document.getElementById('listContainer');
            try {
                const res = await fetch(`${API_BASE}/api/events`, {
                    headers: getAuthHeaders(false)
                });
                if (checkUnauthorized(res)) return;
                if (!res.ok) {
                    // 轮询失败（非 401）：保留现有列表内容，不覆盖
                    if (quiet) {
                        console.warn(`列表轮询失败（HTTP ${res.status}），保留当前列表`);
                        return;
                    }
                    // 非轮询路径保持原有行为（交由下方 json 解析决定空态/失败态）
                }
                const events = await res.json();
                window.userEvents = Array.isArray(events) ? events : [];
                if (!Array.isArray(events) || events.length === 0) {
                    container.innerHTML = '<div class="empty">暂无事件记录</div>';
                    return;
                }
                // 分页：非轮询重置到第 1 页，轮询保持当前页
                const totalPages = Math.max(1, Math.ceil(events.length / LIST_PAGE_SIZE));
                if (!quiet) listPage = 1;
                if (listPage > totalPages) listPage = totalPages;
                if (listPage < 1) listPage = 1;
                const pageEvents = events.slice((listPage - 1) * LIST_PAGE_SIZE, listPage * LIST_PAGE_SIZE);
                const urgencyClass = u => {
                    if (u === '高') return 'tag-high';
                    if (u === '中') return 'tag-medium';
                    return 'tag-low';
                };
                const sceneClass = s => {
                    if (s === '生命急救') return 'tag-scene-life';
                    if (s === '紧急救援') return 'tag-scene-rescue';
                    if (s === '常规') return 'tag-scene-normal';
                    return '';
                };
                const statusClass = s => {
                    if (s === '已撤销') return 'tag-cancelled';
                    if (s === '处理中') return 'tag-processing';
                    if (s === '处理超时' || s === '处理失败' || s === '已拒绝') return 'tag-failed';
                    if (s === '已完成' || s === '已派单') return 'tag-success';
                    if (s === '待审核' || s === '待处理') return 'tag-pending';
                    if (s === '已受理') return 'tag-accepted';
                    return '';
                };
                const statusCell = e => {
                if (e.status === '已拒绝') {
                    const tip = e.rejected_reason ? `title="拒绝理由：${escapeHtml(e.rejected_reason)}"` : '';
                    return `<span class="tag ${statusClass(e.status)}" ${tip}>拒绝</span>`;
                }
                    if (e.status === '已完成' && (e.reply || (e.replies && e.replies.length > 0))) {
                        const unreadBadge = e.has_new_reply ? '<span class="unread-badge">●</span>' : '';
                        return `<span class="reply-link" onclick="handleReplyClick('${e.event_id}')">请点击查看人工的回复${unreadBadge}</span>`;
                    }
                    return `<span class="tag ${statusClass(e.status)}">${escapeHtml(e.status || '-')}</span>`;
                };
                const replyCell = e => {
                    if (e.status === '已拒绝' && e.rejected_reason) {
                        const short = e.rejected_reason.length > 30 ? e.rejected_reason.slice(0, 30) + '…' : e.rejected_reason;
                        return `<span class="reply-cell" title="${escapeHtml(e.rejected_reason)}">${escapeHtml(short)}</span>`;
                    }
                    const replies = e.replies || [];
                    if (!replies.length && !e.reply) return '<span class="muted">-</span>';
                    const count = replies.length || 1;
                    const unreadBadge = e.has_new_reply ? '<span class="unread-badge">●</span>' : '';
                    return `<span class="reply-cell">
                        <span class="reply-link" onclick="handleReplyClick('${e.event_id}')">共 ${count} 条回复${unreadBadge}</span>
                        <span class="reply-thumb" data-event="${e.event_id}"></span>
                    </span>`;
                };
                const mediaCell = e => {
                    const photos = (e.media || []).filter(m => !isAudio(m.media_id));
                    const audios = (e.media || []).filter(m => isAudio(m.media_id));
                    if (!photos.length && !audios.length) return '<span class="muted">-</span>';
                    let html = '';
                    if (audios.length) html += `<span class="media-audio-btn" data-event="${e.event_id}" data-audio="${audios[0].media_id}">▶ 录音</span>`;
                    if (photos.length) html += `<span class="media-photo" data-event="${e.event_id}" data-photo="${photos[0].media_id}"></span>`;
                    return `<span class="media-cell">${html}</span>`;
                };
                const rows = pageEvents.map(e => `
                    <tr data-event-id="${e.event_id}">
                        <td data-label="事件编号">${escapeHtml((e.event_id || '').slice(0, 8))}</td>
                        <td data-label="创建时间">${escapeHtml(e.created_at || '-')}</td>
                        <td data-label="描述" class="clickable-row" onclick="openDetail('${e.event_id}')">${escapeHtml(e.description || '-')}</td>
                                                <td data-label="提交方式">${e.beneficiary_type === 'proxy' ? ('代人办：' + escapeHtml(e.beneficiary_name || '') + '·' + escapeHtml(e.beneficiary_phone || '')) : '本人'}</td>
                        <td data-label="类型">${escapeHtml(e.event_type || '-')}</td>
                        <td data-label="紧急程度"><span class="tag ${urgencyClass(e.urgency)}">${escapeHtml(e.urgency || '-')}</span></td>
                        <td data-label="场景标签"><span class="tag ${sceneClass(e.scene_tag)}">${escapeHtml(e.scene_tag || '-')}</span></td>
                        <td data-label="处理部门">${escapeHtml(e.handler || '-')}</td>
                        <td data-label="状态">${statusCell(e)}</td>
                        <td data-label="附件">${mediaCell(e)}</td>
                        <td data-label="回复">${replyCell(e)}</td>
                        <td data-label="操作">${renderActionCell(e)}</td>
                    </tr>
                `).join('');
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>事件编号</th>
                                <th>创建时间</th>
                                <th>描述</th>
                                                                <th>提交方式</th>
                                <th>类型</th>
                                <th>紧急程度</th>
                                <th>场景标签</th>
                                <th>处理部门</th>
                                <th>状态</th>
                                <th>附件</th>
                                <th>回复</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
                container.innerHTML += `<div class="pagination">${paginationHtml(listPage, totalPages)}</div>`;
                await fillReplyThumbs();
                fillMediaCells();
                startCancelTick();
            } catch (e) {
                if (quiet) {
                    console.warn('列表轮询异常，保留当前列表', e);
                    return;
                }
                container.innerHTML = '<div class="empty">加载失败</div>';
            }
        }

        // ------------------------------------------------------------------
        // 列表轮询：管理员回复后红点自动出现（15 秒自动刷新，复用 loadList，
        //           不改渲染逻辑；与 30 秒撤销按钮重算定时器并存）
        // ------------------------------------------------------------------
        function startListPolling() {
            if (listPollTimer) clearInterval(listPollTimer);
            listPollTimer = setInterval(() => {
                // 回复弹窗打开期间不触发刷新；页面不可见时暂停
                const overlay = document.getElementById('replyOverlay');
                if (overlay && !overlay.classList.contains('hidden')) return;
                if (document.hidden) return;
                // 用户正在输入时跳过刷新，避免打断输入
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
                loadList(true);
            }, POLL_LIST_MS);
        }

        // 页面卸载时清理轮询定时器
        window.addEventListener('beforeunload', () => {
            if (listPollTimer) clearInterval(listPollTimer);
        });

        // 页面初始化：先认证，再加载数据；加载成功后启动 15 秒列表轮询
        // ------------------------------------------------------------------
        // 富提交：媒体 / 语音 / 时间线详情
        // ------------------------------------------------------------------
        let mediaIds = [];
        let pickedLoc = null;
        let locMap = null, locMarker = null;
        function openLocationPicker() {
            document.getElementById('locationPickerOverlay').classList.remove('hidden');
            _syncBodyScroll();
            initLocMap();
        }
        function defaultCenter() {
            return [30.274, 120.155];
        }
        function initLocMap() {
            if (!window.L) { alert('地图组件加载失败'); return; }
            const start = pickedLoc ? [pickedLoc.lat, pickedLoc.lng] : defaultCenter();
            if (locMap) { locMap.remove(); locMap = null; }
            locMap = L.map('locMap').setView(start, 16);
            L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', { maxZoom: 18, attribution: '© 高德地图', subdomains: '1234' }).addTo(locMap);
            locMarker = L.marker(start, { draggable: true }).addTo(locMap);
            locMarker.on('dragend', () => { const p = locMarker.getLatLng(); onPickPos(p.lat, p.lng); });
            locMap.on('click', (e) => { locMarker.setLatLng(e.latlng); onPickPos(e.latlng.lat, e.latlng.lng); });
            if (pickedLoc) {
                document.getElementById('locAddr').value = pickedLoc.address || '';
            } else {
                document.getElementById('locAddr').value = '';
                getPosition().then(p => { if (p) { locMap.setView([p.lat, p.lng], 16); locMarker.setLatLng([p.lat, p.lng]); onPickPos(p.lat, p.lng); } });
            }
        }
        async function onPickPos(lat, lng) {
            try {
                const res = await fetch(`${API_BASE}/api/geo/regeo?lat=${lat}&lng=${lng}`, { headers: getAuthHeaders(false) });
                if (res.ok) { const d = await res.json(); document.getElementById('locAddr').value = d.address || ''; }
            } catch (e) {}
        }
        async function locSearchGo() {
            const kw = document.getElementById('locSearch').value.trim();
            const hint = document.getElementById('locSearchHint');
            const tipsBox = document.getElementById('locTips');
            if (!kw) { tipsBox.style.display = 'none'; return; }
            hint.textContent = '搜索中…';
            try {
                const res = await fetch(`${API_BASE}/api/geo/search?kw=${encodeURIComponent(kw)}`, { headers: getAuthHeaders(false) });
                const d = await res.json().catch(() => ({}));
                const tips = (d && d.tips) ? d.tips : [];
                hint.textContent = tips.length ? '' : '无结果';
                window.__locTips = tips;
                tipsBox.innerHTML = tips.map((t, i) => `<div class="loc-tip" onclick="locPickTip(${i})">${escapeHtml(t.name)}<span class="muted">${escapeHtml(t.address || '')}</span></div>`).join('');
                tipsBox.style.display = tips.length ? 'block' : 'none';
            } catch (e) { hint.textContent = '搜索失败'; }
        }
        function locPickTip(i) {
            const t = (window.__locTips || [])[i]; if (!t) return;
            locMap.setView([parseFloat(t.lat), parseFloat(t.lng)], 16);
            locMarker.setLatLng([parseFloat(t.lat), parseFloat(t.lng)]);
            onPickPos(parseFloat(t.lat), parseFloat(t.lng));
            document.getElementById('locSearch').value = t.name;
            document.getElementById('locTips').style.display = 'none';
        }
        function confirmLocation() {
            if (!locMarker) { alert('请先在地图上选择位置'); return; }
            const p = locMarker.getLatLng();
            pickedLoc = { lat: p.lat, lng: p.lng, address: document.getElementById('locAddr').value.trim() };
            document.getElementById('locAddrInput').value = pickedLoc.address;
            document.getElementById('locShow').textContent = pickedLoc.address ? ('已选位置：' + pickedLoc.address) : '已选位置（坐标）';
            closeLocationPicker();
        }
        function closeLocationPicker() {
            document.getElementById('locationPickerOverlay').classList.add('hidden');
            _syncBodyScroll();
            if (locMap) { locMap.remove(); locMap = null; }
        }

        const mediaUrlCache = {};
        async function mediaUrl(id) {
            if (!id) return '';
            if (mediaUrlCache[id]) return mediaUrlCache[id];
            try {
                const res = await fetch(`${API_BASE}/api/media/${id}`, { headers: getAuthHeaders(false) });
                if (!res.ok) return '';
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                mediaUrlCache[id] = url;
                return url;
            } catch (e) { return ''; }
        }
        function resetMedia() { mediaIds = []; document.getElementById('photoGrid').innerHTML = ''; }
        function isAudio(id) { return /\.(mp3|m4a|wav|ogg|webm)$/i.test(id || ''); }
        async function renderPhotoGrid() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';
            for (let i = 0; i < mediaIds.length; i++) {
                const id = mediaIds[i];
                const div = document.createElement('div');
                div.className = 'photo-thumb';
                if (isAudio(id)) {
                    div.innerHTML = `<div style="font-size:12px;color:#1d4ed8">&#127925; 录音</div><span class="rm" onclick="removeMedia(${i})">×</span>`;
                } else {
                    const url = await mediaUrl(id);
                    div.innerHTML = `<img src="${url}" alt="照片"><span class="rm" onclick="removeMedia(${i})">×</span>`;
                }
                grid.appendChild(div);
            }
        }
        function removeMedia(i) { mediaIds.splice(i, 1); renderPhotoGrid(); }
        async function uploadFile(file, kind = 'photo') {
            const fd = new FormData();
            fd.append('file', file);
            fd.append('kind', kind);
            const res = await fetch(`${API_BASE}/api/uploads`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                body: fd
            });
            if (checkUnauthorized(res)) return null;
            const data = await res.json();
            return data && data.data ? data.data.media_id : null;
        }
        async function onPickPhotos(files) {
            for (const file of Array.from(files || [])) {
                if (mediaIds.length >= 3) { alert('最多3张照片'); break; }
                if (!file.type.startsWith('image/')) continue;
                const id = await uploadFile(file, 'photo');
                if (id) { mediaIds.push(id); await renderPhotoGrid(); }
            }
            document.getElementById('photoInput').value = '';
        }

        let mediaRecorder = null;
        let recordedChunks = [];
        let recStart = 0;
        let recTimer = null;
        let recordingPressed = false;
        const REC_MAX_MS = 60000;

        async function startRecording() {
            const hint = document.getElementById('voiceHint');
            if (mediaRecorder && mediaRecorder.state === 'recording') return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { hint.textContent = '当前环境不支持录音（需 HTTPS）'; return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
                    const dur = Date.now() - recStart;
                    if (dur < 1000) {
                        hint.textContent = '说话时间太短';
                        stream.getTracks().forEach(tr => tr.stop());
                        mediaRecorder = null;
                        return;
                    }
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const ext = (blob.type.includes('mp4') || blob.type.includes('m4a')) ? 'm4a' : (blob.type.includes('ogg') ? 'ogg' : 'webm');
                    const file = new File([blob], 'rec.' + ext, { type: blob.type });
                    const id = await uploadFile(file, 'audio');
                    if (id) {
                        mediaIds = mediaIds.filter(x => !isAudio(x)); // 每事件仅一条录音
                        mediaIds.push(id);
                        await renderPhotoGrid();
                        hint.textContent = '录音已附加（' + Math.round(dur / 1000) + '秒）';
                    }
                    stream.getTracks().forEach(tr => tr.stop());
                    mediaRecorder = null;
                };
                recStart = Date.now();
                mediaRecorder.start();
                hint.textContent = '正在录音…松开结束';
                recTimer = setTimeout(() => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, REC_MAX_MS);
                // 如果按下后在获取麦克风权限期间就松开了，判断为过短，立即停止，避免“点一下开始、再点一下停止”的异常行为
                if (!recordingPressed) mediaRecorder.stop();
            } catch (e) { hint.textContent = '无法访问麦克风：' + e.message; }
        }
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        }
        async function prewarmMic() {
            // 提前请求麦克风权限（第一次进入语音上报时触发一次授权），避免按住说话时才弹出授权导致录音失败
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(tr => tr.stop());
            } catch (e) { /* 忽略：权限未授或已拒绝 */ }
        }
        function bindRecBtn() {
            const btn = document.getElementById('recBtn');
            if (!btn) return;
            btn.addEventListener('contextmenu', e => e.preventDefault());
            btn.addEventListener('pointerdown', e => { e.preventDefault(); recordingPressed = true; startRecording(); });
            btn.addEventListener('pointerup', e => { e.preventDefault(); recordingPressed = false; stopRecording(); });
            btn.addEventListener('pointerleave', () => { recordingPressed = false; stopRecording(); });
            btn.addEventListener('touchcancel', () => { recordingPressed = false; stopRecording(); });
            btn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
        }

        let currentDetailId = null;
        async function openDetail(eventId) {
            currentDetailId = eventId;
            document.getElementById('detailContent').innerHTML = '<div class="empty">加载中…</div>';
            document.getElementById('detailOverlay').classList.remove('hidden');
            _syncBodyScroll();
            try {
                const res = await fetch(`${API_BASE}/api/events/${eventId}`, { headers: getAuthHeaders(false) });
                if (checkUnauthorized(res)) return;
                if (!res.ok) { document.getElementById('detailContent').innerHTML = '<div class="empty">加载失败</div>'; return; }
                renderDetail(await res.json());
            } catch (e) { document.getElementById('detailContent').innerHTML = '<div class="empty">加载失败</div>'; }
        }
        async function renderDetail(e) {
            const tl = await Promise.all((e.timeline || []).map(async n => {
                let photos = '';
                if (n.photos && n.photos.length) {
                    const imgs = [];
                    for (const p of n.photos) { const u = await mediaUrl(p); if (u) imgs.push(`<img class="tl-photo" src="${u}" alt="" onclick="openPhoto('${u}');event.stopPropagation()">`); }
                    if (imgs.length) photos = `<div class="tl-photos">${imgs.join('')}</div>`;
                }
                return `<div class="tl-item"><div class="tl-time">${escapeHtml(n.time || '')} · ${escapeHtml(n.type || '')}</div><div class="tl-text">${escapeHtml(n.text || '')}</div>${n.actor ? `<div class="tl-actor">${escapeHtml(n.actor)}</div>` : ''}${photos}</div>`;
            }));
            let follow = '';
            if (['已受理', '处理中', '已完成'].includes(e.status)) {
                follow = `<div class="form-row"><textarea id="followupText" placeholder="向工作人员追问"></textarea></div><button class="btn-sm" onclick="sendFollowup('${e.event_id}')">发送追问</button>`;
            }
            let audioHtml = '';
            for (const m of (e.media || [])) {
                if (!isAudio(m.media_id)) continue;
                const au = await mediaUrl(m.media_id);
                if (au) audioHtml += `<div class="tl-item"><div class="modal-text">&#127908; 我的录音</div><audio controls src="${au}" style="width:100%"></audio></div>`;
            }
            let userPhotosHtml = '';
            const userPhotoMedia = (e.media || []).filter(m => !isAudio(m.media_id));
            if (userPhotoMedia.length) {
                const imgs = [];
                for (const m of userPhotoMedia) { const u = await mediaUrl(m.media_id); if (u) imgs.push(`<img class="tl-photo" src="${u}" alt="照片" onclick="openPhoto('${u}');event.stopPropagation()">`); }
                if (imgs.length) userPhotosHtml = `<div class="modal-text"><b>我上传的照片</b></div><div class="tl-photos">${imgs.join('')}</div>`;
            }
            let tScript = '';
            if (e.audio_transcript) tScript = `<div class="modal-text"><b>语音转写：</b>${escapeHtml(e.audio_transcript)}</div>`;
            let repliesHtml = '';
            if ((e.replies || []).length) {
                const items = [];
                for (const r of e.replies) {
                    let ph = '';
                    if (r.photos && r.photos.length) {
                        const ts = [];
                        for (const p of r.photos) { const u = await mediaUrl(p); if (u) ts.push(`<img class="tl-photo" src="${u}" alt="照片" onclick="openPhoto('${u}');event.stopPropagation()">`); }
                        if (ts.length) ph = `<div class="tl-photos">${ts.join('')}</div>`;
                    }
                    items.push(`<div class="reply-item"><div class="reply-meta">${escapeHtml(r.reviewer_name || '管理员')} · ${escapeHtml(r.created_at)}</div><div class="reply-content">${escapeHtml(r.content)}</div>${ph}</div>`);
                }
                repliesHtml = `<div class="modal-text"><b>处理回复</b></div>${items.join('')}`;
            }
            document.getElementById('detailContent').innerHTML = `<div class="modal-text">${escapeHtml(e.description || '（未填写描述，以录音为准）')}</div><div class="modal-text muted">类型：${escapeHtml(e.event_type || '-')} · 状态：${escapeHtml(e.status || '-')} · 部门：${escapeHtml(e.department_name || e.handler || '-')}</div>${tScript}${audioHtml}${userPhotosHtml}${repliesHtml}<div class="timeline">${tl.join('')}</div>${follow}`;
        }
        function closeDetail() { document.getElementById('detailOverlay').classList.add('hidden'); _syncBodyScroll(); currentDetailId = null; }
        async function sendFollowup(eventId) {
            const txt = document.getElementById('followupText').value.trim();
            if (!txt) { alert('请输入追问内容'); return; }
            const res = await fetch(`${API_BASE}/api/events/${eventId}/reply`, {
                method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ reply: txt, photos: [] })
            });
            if (checkUnauthorized(res)) return;
            if (res.ok) { alert('追问已发送'); openDetail(eventId); loadList(); }
            else { const d = await res.json().catch(() => ({})); alert((d && d.detail) || '发送失败'); }
        }

        // ---- 系统公告：居民登录强制阅读（完全拦截前） ----
        let announcementQueue = [];
        let currentAnnouncementId = null;
        let afterAnnouncements = null;
        async function checkAnnouncements() {
            try {
                const res = await fetch(`${API_BASE}/api/announcements/unread`, { headers: getAuthHeaders(false) });
                if (checkUnauthorized(res)) return true;
                if (!res.ok) return true;
                const d = await res.json();
                announcementQueue = (d && d.announcements) ? d.announcements : [];
                if (announcementQueue.length) { showNextAnnouncement(); return false; }
                return true;
            } catch (e) { return true; }
        }
        function showNextAnnouncement() {
            if (!announcementQueue.length) {
                document.getElementById('announcementOverlay').classList.add('hidden');
                if (afterAnnouncements) { const f = afterAnnouncements; afterAnnouncements = null; f(); }
                return;
            }
            const a = announcementQueue.shift();
            currentAnnouncementId = a.id;
            document.getElementById('announcementContent').innerHTML = `<div class="modal-title" style="padding-left:0;">${escapeHtml(a.title)}</div><div class="modal-text">${a.content}</div>`;
            document.getElementById('announcementOverlay').classList.remove('hidden');
        }
        async function markAnnouncementRead() {
            if (!currentAnnouncementId) return;
            try { await fetch(`${API_BASE}/api/announcements/${currentAnnouncementId}/read`, { method: 'POST', headers: getAuthHeaders(false) }); } catch (e) {}
            currentAnnouncementId = null;
            showNextAnnouncement();
        }

        initAuth().then(async ok => {
            if (!ok) return;
            const startPage = () => { setSubmitMode('text'); bindRecBtn(); loadList(); startListPolling(); };
            const resident = (window.currentUser || {}).role === 'resident';
            if (resident) {
                afterAnnouncements = startPage;
                const go = await checkAnnouncements();
                if (!go) return;
            }
            startPage();
        });
    </script>
</body>
