route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    # 通用 webhook：填你的通知地址
    webhook_configs:
      - url: "https://your-webhook.example.com/alert"
        send_resolved: true
