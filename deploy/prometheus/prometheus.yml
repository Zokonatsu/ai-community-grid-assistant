global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "ai-community-grid"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "localhost:8000"
