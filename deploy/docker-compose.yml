# docker-compose v3.8（兼容 docker-compose v1 与 docker compose v2）
# 环境变量统一由 ../.env 通过 env_file 注入，不再使用 ${...} 插值，
# 避免 compose 未加载 .env 时插值成空串覆盖真实配置（2026-08-21 生产事故根因）。
version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../secure:/app/secure
    restart: unless-stopped