# =============================================================================
# 社区网格助手 · Nginx 反向代理配置（生产可选；deploy/DEPLOY.md §4 / §8.4）
# -----------------------------------------------------------------------------
# 适用拓扑（与 DEPLOY.md 一致）：
#   [公网] --> 80/443 --> Nginx(本机) --> 127.0.0.1:8000 (uvicorn/FastAPI)
#
# 启用步骤：
#   1) sudo apt-get install -y nginx
#   2) sudo cp deploy/nginx.conf /etc/nginx/sites-available/grid-assistant
#      sudo ln -s /etc/nginx/sites-available/grid-assistant /etc/nginx/sites-enabled/
#      # 若 /etc/nginx/sites-enabled/default 存在且 server_name 冲突，先禁用：
#      # sudo rm /etc/nginx/sites-enabled/default
#   3) 按需修改下方占位符：server_name、upstream 地址、/metrics 放行网段
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
#   - uvicorn 默认已启用 --proxy-headers 并信任 127.0.0.1，因此登录/事件限流
#     会按 X-Forwarded-For 中的真实客户端 IP 计数（Nginx 反代不破坏限流）。
#   - /metrics 无鉴权，默认仅放行本机（127.0.0.1/::1）；Prometheus 在其它
#     内网机器时，请放开对应网段（见 docs/监控告警.md §5）。
#   - HTTPS 可选，配合 certbot 自动申请/续期，见文末注释块。
# =============================================================================

upstream grid_app {
    # 单实例：docker-compose 已将 8000 发布到宿主机
    server 127.0.0.1:8000;
    keepalive 32;

    # --- 多副本示例（DEPLOY.md §8.4；数据层共享/单写者就绪后再启用）---
    # server 10.0.0.11:8000;
    # server 10.0.0.12:8000;
    # # 本地会话模式建议开启会话保持；账号上云/共享数据层后可去掉
    # ip_hash;
}

server {
    listen 80;
    # 占位符：替换为真实域名（如 grid.example.com），或直接通过 IP 访问时填
    # 公网 IP；不关心 Host 时可写 "_"（匹配任意主机名）。
    server_name grid.example.com;

    # 隐藏 nginx 版本号
    server_tokens off;

    # 与 FastAPI 请求体大小匹配（默认 10m）
    client_max_body_size 10m;

    # gzip 文本响应（JSON API + 前端静态资源）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 指标端点安全（docs/监控告警.md §5）：/metrics 无鉴权，
    # 默认仅本机可抓取；Prometheus 在其它机器时放开对应网段并保留 deny all。
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.0/8;      # Prometheus 所在内网段
        # allow 192.168.0.0/16;  # 或运维内网段
        deny all;

        proxy_pass http://grid_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（DEPLOY.md 3.3/5.4）：返回 {"status":"ok"}，无敏感信息
    location = /health {
        proxy_pass http://grid_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://grid_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 调用可能较慢，读超时放宽，避免长任务被 60s 截断
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }
}

# =============================================================================
